<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Driver Portal - Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <style>
        body {
            background-color: #343a40;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background-color: #495057;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-control {
            background-color: #6c757d;
            color: white;
            border: none;
        }

        .form-control:focus {
            background-color: #6c757d;
            color: white;
            box-shadow: none;
            border: 1px solid #007bff;
        }

        .btn-primary {
            width: 100%;
            font-weight: bold;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="/media/Company_Logo.png" alt="BVM Logo" style="max-width: 150px; height: auto;">
        </div>
        <div class="login-header" style="text-align: center;">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Driver Login</h1>
            <p style="font-size: 0.9rem; color: #ced4da;">Enter your credentials to access the portal</p>
        </div>
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" name="mobile_number" class="form-control" placeholder="10-digit mobile" required>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Login</button>

            <div style="text-align: center; margin-top: 15px;">
                <a href="{% url 'customer_login' business_id=2 %}"
                    style="color: #ced4da; font-size: 0.9rem; text-decoration: underline;">
                    Customer Login (Main)
                </a>
            </div>
        </form>
    </div>
</body>

</html>
