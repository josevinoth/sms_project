{% extends "asset_mgt_app/header_1.html" %}

{% block content %}
<style>
	@import url('https://fonts.googleapis.com/css2?family=Monoton&family=Montserrat:wght@900&family=Poppins:wght@400;600&display=swap');

	body {
		background: url('/media/warehouse_bw.png') no-repeat center center fixed;
		background-size: cover;
	}

	body::before {
		content: "";
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: rgba(0, 0, 0, 0.6);
		z-index: 0;
	}

	.auth-card {
		z-index: 1;
		max-width: 500px;
		margin: 4rem auto;
		display: flex;
		flex-direction: column;
		box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
		border-radius: 16px;
		overflow: hidden;
		backdrop-filter: blur(10px);
		background: rgba(255, 255, 255, 0.08);
		border: 1px solid rgba(255, 255, 255, 0.15);
		padding: 2.5rem;
		color: #fff;
	}

	.auth-header {
		text-align: center;
		margin-bottom: 2rem;
	}

	.btn-primary {
		width: 100%;
		padding: 0.8rem;
		border: none;
		border-radius: 8px;
		background: linear-gradient(135deg, #237fb7, #1a5c85);
		color: #fff;
		font-weight: 600;
		cursor: pointer;
		transition: all 0.3s;
		text-decoration: none;
		display: block;
		text-align: center;
	}

	.btn-primary:hover {
		background: linear-gradient(135deg, #2cafeb, #237fb7);
		transform: translateY(-2px);
		color: #fff;
	}
</style>

<div class="auth-card">
	<div class="auth-header">
		<h2 style="font-weight: 700; color: #fff; margin-bottom: 0.5rem;">Reset Complete</h2>
		<div style="font-size: 3rem; color: #28a745; margin-bottom: 1rem;"><i class="fa fa-check-circle"></i></div>
	</div>

	<div style="text-align: center; color: #ddd; line-height: 1.6; padding-bottom: 1rem;">
		<p>Your password has been set successfully.</p>
		<p>You can now log in with your new password.</p>
	</div>

	<a href="{% url 'login_page' %}" class="btn-primary">
		<i class="fa fa-sign-in-alt"></i> Log In
	</a>
</div>
{% endblock %}
