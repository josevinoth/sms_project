{% load widget_tweaks %}
<form method="post" action="{% url 'dmr_send_email' %}">
  {% csrf_token %}
  <div class="input-group mb-2">
    <div class="input-group-prepend"><div class="input-group-text">Customer</div></div>
    {% render_field form.dmr_customer id="dmr_customer" class="form-control" value=customer_name %}
  </div>

  <div class="input-group mb-2">
    <div class="input-group-prepend"><div class="input-group-text">To</div></div>
    <input type="text" name="recipient" id="recipient" class="form-control" placeholder="Recipient emails">
  </div>

  <div class="input-group mb-2">
    <div class="input-group-prepend"><div class="input-group-text">Message</div></div>
    <textarea name="message" id="message" class="form-control" rows="6"></textarea>
  </div>

  <div class="text-center">
    <button type="submit" class="btn btn-primary"><i class="fas fa-envelope"></i> Send Email</button>
  </div>
</form>

<script>
function email_message_fn() {
  var msg = "Dear Customer,\n\nPlease find the DMR report attached.\n\nRegards,\nBVM Transport Team";
  document.getElementById("message").value = msg;
}
</script>
