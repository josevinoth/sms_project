{% extends "asset_mgt_app/base_modern.html" %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<div class="modern-list-header">
    <div class="modern-list-title">
        <i class="fas fa-file-invoice-dollar"></i>
        <h2>{{ title }}</h2>
    </div>
    <div class="modern-list-actions">
        <a href="{% url 'transport_reports' %}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left mr-1"></i> Back to Reports
        </a>
    </div>
</div>

<!-- Modern Filter Section -->
<div class="form-section">
    <form method="GET" class="row g-3 align-items-end" id="filterForm">
        <!-- Branch Filter -->
        <div class="col-md-2 mb-2">
            <label class="form-label font-weight-bold">Branch</label>
            <select name="branch" id="branch" class="form-control form-control-modern select2">
                <option value="">-- All Branches --</option>
                {% for branch in branches %}
                <option value="{{ branch.id }}" {% if branch.id|stringformat:"s" == branch_param %}selected{% endif %}>
                    {{ branch.loc_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Veh Source Filter -->
        <div class="col-md-2 mb-2">
            <label class="form-label font-weight-bold">Veh Source</label>
            <select name="veh_source" id="veh_source" class="form-control form-control-modern select2">
                <option value="">-- All --</option>
                <option value="3" {% if veh_source_param == '3' %}selected{% endif %}>Market</option>
                <option value="2" {% if veh_source_param == '2' %}selected{% endif %}>Attached</option>
            </select>
        </div>

        <!-- From Date -->
        <div class="col-md-2 mb-2">
            <label class="form-label font-weight-bold">From Date</label>
            <input type="date" name="from_date" id="from_date" class="form-control form-control-modern" value="{{ from_date_param }}">
        </div>

        <!-- To Date -->
        <div class="col-md-2 mb-2">
            <label class="form-label font-weight-bold">To Date</label>
            <input type="date" name="to_date" id="to_date" class="form-control form-control-modern" value="{{ to_date_param }}">
        </div>

        <!-- Vendor Name Filter -->
        <div class="col-md-2 mb-2">
            <label class="form-label font-weight-bold">Vendor Name</label>
            <select name="vendor_name" id="vendor_name" class="form-control form-control-modern select2">
                <option value="">-- All Vendors --</option>
                {% for vendor in vendors %}
                <option value="{{ vendor.id }}" {% if vendor.id|stringformat:"s" == vendor_param %}selected{% endif %}>
                    {{ vendor.vend_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Status Filter -->
        <div class="col-md-2 mb-2">
            <label class="form-label font-weight-bold">Status</label>
            <select name="status" id="status" class="form-control form-control-modern select2">
                <option value="">-- All Statuses --</option>
                <option value="1" {% if status_param == '1' %}selected{% endif %}>Trip Started</option>
                <option value="2" {% if status_param == '2' %}selected{% endif %}>Trip Closed</option>
                <option value="7" {% if status_param == '7' %}selected{% endif %}>Trip Settled</option>
                <option value="9" {% if status_param == '9' %}selected{% endif %}>Ready for Invoice</option>
                <option value="10" {% if status_param == '10' %}selected{% endif %}>Cancellation with Billing</option>
            </select>
        </div>

        <!-- Buttons -->
        <div class="col-md-2 mb-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-block mr-1">
                <i class="fas fa-filter mr-1"></i> Filter
            </button>
            <a href="{% url 'vendor_bills_pending_mkt_att_report' %}" class="btn btn-outline-secondary">
                <i class="fas fa-undo"></i>
            </a>
        </div>
    </form>
</div>

<!-- Modern Table Card -->
<div class="modern-card">
    <div class="table-responsive">
        <table class="table modern-table table-hover" id="vendor_pending_bills_mkt_table" style="width: 100%;">
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Trip Date</th>
                    <th>Cnote</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Customer Name</th>
                    <th>Veh No</th>
                    <th>Veh Type</th>
                    <th>Veh Source</th>
                    <th>Vendor Name</th>
                    <th>Buy Cost</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loaded via Server-Side AJAX -->
            </tbody>
        </table>
    </div>
</div>

<script>
    $(document).ready(function () {
        const table = $('#vendor_pending_bills_mkt_table').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
                url: "{% url 'vendor_bills_pending_mkt_att_report_ajax' %}",
                type: "GET",
                data: function (d) {
                    d.branch = $('#branch').val();
                    d.veh_source = $('#veh_source').val();
                    d.from_date = $('#from_date').val();
                    d.to_date = $('#to_date').val();
                    d.vendor_name = $('#vendor_name').val();
                    d.status = $('#status').val();
                }
            },
            scrollX: true,
            scrollY: "58vh",
            scrollCollapse: true,
            autoWidth: false,
            dom: "<'row mb-2'<'col-sm-12 col-md-6 d-flex align-items-center'lB><'col-sm-12 col-md-6 d-flex justify-content-end'f>>" +
                 "<'row'<'col-sm-12'tr>>" +
                 "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7 d-flex justify-content-end'p>>",
            lengthMenu: [
                [10, 25, 50, 100, 250, -1],
                [10, 25, 50, 100, 250, "All"]
            ],
            pageLength: 25,
            buttons: [
                { extend: 'copy', className: 'btn btn-outline-secondary btn-sm mr-1' },
                { extend: 'csv', className: 'btn btn-outline-secondary btn-sm mr-1' },
                { extend: 'excelHtml5', className: 'btn btn-outline-success btn-sm mr-1', title: 'Vendor Bills Pending Report MKT/ATT' },
                { extend: 'pdfHtml5', className: 'btn btn-outline-danger btn-sm mr-1', orientation: 'landscape', pageSize: 'A4', title: 'Vendor Bills Pending Report MKT/ATT' },
                { extend: 'print', className: 'btn btn-outline-dark btn-sm', title: 'Vendor Bills Pending Report MKT/ATT' }
            ],
            ordering: false,
            columns: [
                { width: "50px", className: "text-center" }, // S.No
                { width: "95px" },  // Trip Date
                { width: "135px" }, // Cnote
                { width: "120px" }, // From
                { width: "120px" }, // To
                { width: "130px" }, // Customer Name
                { width: "100px" }, // Veh No
                { width: "100px" }, // Veh Type
                { width: "90px" },  // Veh Source
                { width: "140px" }, // Vendor Name
                { width: "85px", className: "text-right font-weight-bold" },  // Buy Cost
                { width: "110px", className: "text-center" }  // Status
            ]
        });

        // Instant filter on form submit without page reload
        $('#filterForm').on('submit', function (e) {
            e.preventDefault();
            table.ajax.reload();
        });

        $(window).on('resize', function () {
            table.columns.adjust();
        });

        $('#branch').select2({
            width: '100%',
            placeholder: '-- All Branches --',
            allowClear: true
        });

        $('#veh_source').select2({
            width: '100%',
            placeholder: '-- All --',
            allowClear: true
        });

        $('#vendor_name').select2({
            width: '100%',
            placeholder: '-- All Vendors --',
            allowClear: true
        });

        $('#status').select2({
            width: '100%',
            placeholder: '-- All Statuses --',
            allowClear: true
        });
    });
</script>
{% endblock %}
