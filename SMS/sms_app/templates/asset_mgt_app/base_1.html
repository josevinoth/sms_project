<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Application</title>

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap 4.6.0 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

    <!-- DataTables v1.13.8 CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap4.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap4.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap4.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/select/1.7.0/css/select.bootstrap4.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <!-- Bootstrap Multiselect -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-multiselect/0.9.15/css/bootstrap-multiselect.css">

    <!-- Bootstrap Select -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'all.css' %}">
    <script src="{% static 'common-chart-config.js' %}"></script>
</head>

<body style="background-color: whitesmoke;">
<!-- Header -->
<div class="header_style  text-white sticky-top" style="background-color: #0D2F3F;">
    <div class="container-fluid">
        <!-- Desktop layout -->
        <div class="row align-items-center d-none d-md-flex">
            <div class="col-2 text-center">
                <a href="{% url 'home_page' %}" class="btn btn-dark p-1">
                    <i class="fas fa-home fa-lg"></i>
                </a>
            </div>
            <div class="col-8 d-flex align-items-center justify-content-center">
                <img src="/media/Company_Logo.png" alt="Logo" style="width:40px;height:50px;" class="mr-2">
                <h1 class="mb-0" style="font-size:2rem; font-weight:bold;">BVM Management System</h1>
            </div>
            <div class="col-2 text-center">
                <div>
                    Hi, {{ request.session.first_name }}
                    <small class="text-warning">{{ request.session.ses_role }}</small>
                </div>

                <a href="{% url 'logout_page' %}" class="btn btn-dark p-1 m-2">
                    <i class="fas fa-sign-out-alt fa-lg"></i>
                </a>
            </div>
        </div>
        <!-- Mobile layout -->
        <div class="d-block d-md-none p-2 ">
            <div class="d-flex align-items-center">
                <!-- Logo -->
                <div>
                    <img src="/media/Company_Logo.png" alt="Logo" style="width:50px; height:60px;">
                </div>
                <!-- Right side content -->
                <div class="flex-grow-1 ml-2">
                    <div class="h5 mb-2 font-weight-bold">BVM Management System</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'home_page' %}" class="btn btn-dark btn-sm ">
                            <i class="fas fa-home"></i>
                        </a>
                        <small>{{ request.session.first_name }}</small>
                        <small style="color: #3399ff;">{{ request.session.ses_role }}</small>
                        <a href="{% url 'logout_page' %}" class="btn btn-dark btn-sm ">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Content -->
<div class="container-fluid pt-2 pb-5">
    {% block content %}
    {% endblock content %}
</div>

<!-- Scripts -->
<!-- jQuery (latest compatible) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap Bundle (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-multiselect/0.9.15/js/bootstrap-multiselect.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>


<!-- DataTables v1.13.8 JS -->
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap4.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
<script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>
{% block scripts %}{% endblock scripts %}
</body>
</html>
