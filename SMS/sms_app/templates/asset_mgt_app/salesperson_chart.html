{% extends "asset_mgt_app/base.html" %}
{% load widget_tweaks %}
{% block content %}


<body>
<h3 style="color:black;">Sales Calls Per Salesperson</h3>
<br>
<div class="container-fluid row align-items-center" style="margin-bottom: 20px;">
    <div class="col-md-1">
        <a href="{% url 'sales_reports' %}" class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <div class="col-md-11">

        <label for="salesperson-filter"><b>Salesperson:</b></label>
        <select id="salesperson-filter" name="salesperson" style="box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); padding: 5px; font-size: 12px; width: 150px;margin-right: 20px;">
            <option value="">All</option>
            {% for salesperson in salespersons %}
                <option value="{{ salesperson }}"
                    {% if salesperson == selected_salesperson %} selected {% endif %}>
                    {{ salesperson }}
                </option>
            {% endfor %}
        </select>

        <label for="from-date"><b> From:</b></label>
        <input type="date" id="from-date" name="from_date" value="{{ from_date }}" style="box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); width: 200px; padding: 5px; font-size: 12px; margin-right: 20px;">

        <label for="to-date"><b> To:</b></label>
        <input type="date" id="to-date" name="to_date" value="{{ to_date }}" style="box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.4); width: 200px; padding: 5px; font-size: 12px;">
    </div>
</div>

    <canvas id="salesChart" width="300" height="100" style="background: white;box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);"></canvas>
<br>
<hr>
    <table id="sales_person_table" class="table table-striped table-bordered" border="3" style="width: 50%; border-collapse: collapse; ">
        <thead class="thead-dark">
            <tr>
                <th>Sr No</th>
                <th >Salesperson Name</th>
                <th>Sales Calls</th>
            </tr>
        </thead>
        <tbody>
            {% for label, count in table_data %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td style="padding: 10px;">{{ label }}</td>
                <td style="padding: 10px;">{{ count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
<script>
    $(document).ready(function() {
    $('#sales_person_table').DataTable(
        {
        scrollY: "600px",
<!--        scrollX: true,-->
        scrollCollapse: true,
        order: [1, 'desc' ],
        dom: 'lBfrtip',
        buttons: [
            'copy', 'csv', 'excel', 'print'
        ]
    } );
} );
</script>

    <script>
        const labels = {{ labels|safe }};
        const data = {{ data|safe }};

        const ctx = document.getElementById('salesChart').getContext('2d');
       const salesChart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Sales Count',
            data: data,
            backgroundColor: 'rgba(255, 99, 132, 0.2)',
            borderColor: 'rgb(255, 99, 132)',
            borderWidth: 1,
            borderRadius: 4,
            barThickness: 50, // Fixed bar width
            maxBarThickness: 50 // Prevent bars from becoming too broad
        }]
    },
    options: {
        plugins: {
                     legend: {
                     display: true,
                     position: 'top', // Position legend at the top
             labels: {
                 font: {
                          size: 14, // Font size for legend labels
                           weight: 'bold' // Bold legend labels
                        },
            color: '#000' // Color of legend labels
        }
    },
            datalabels: {
                anchor: 'end',
                align: 'top',
                formatter: (value) => value,
                font: {
                    size: 12,
                    weight: 'bold'
                },
                color: '#000',
                backgroundColor: 'rgba(235, 233, 234, 0.8)',
                borderRadius: 4,
                padding: 5,
                borderWidth: 1,
                borderColor: '#000'
            }
        },
        responsive: true,
        scales: {
            x: {
                ticks: {
                    font: {
                        size: 12, // Font size for x-axis labels
                        weight: 'bold' // Bold x-axis labels
                    },
                    color: '#000' // Black color for x-axis labels
                }
            },
            y: {
                beginAtZero: true
            }
        }
    },
    plugins: [ChartDataLabels]
});


        document.getElementById('salesperson-filter').addEventListener('change', updateFilters);
        document.getElementById('from-date').addEventListener('change', updateFilters);
        document.getElementById('to-date').addEventListener('change', updateFilters);

        function updateFilters() {
            const salesperson = document.getElementById('salesperson-filter').value;
            const fromDate = document.getElementById('from-date').value;
            const toDate = document.getElementById('to-date').value;
            const url = new URL(window.location.href);


            if (salesperson) {
                url.searchParams.set('salesperson', salesperson);
            } else {
                url.searchParams.delete('salesperson');
            }


            if (fromDate) {
                url.searchParams.set('from_date', fromDate);
            } else {
                url.searchParams.delete('from_date');
            }

            if (toDate) {
                url.searchParams.set('to_date', toDate);
            } else {
                url.searchParams.delete('to_date');
            }

            window.location.href = url.toString();
        }
    </script>

</body>
{% endblock content %}
