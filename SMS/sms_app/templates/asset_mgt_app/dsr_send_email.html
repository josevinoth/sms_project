{% load widget_tweaks %}
{% block content %}
<!-- Email Form -->
<style>
    /* Fix Select2 alignment inside Bootstrap input-group */
    .input-group > .select2-container--classic {
        flex: 1 1 auto;
        width: 1% !important;
    }
    .select2-container--classic .select2-selection--single {
        height: 100% !important;
        border-top-left-radius: 0 !important;
        border-bottom-left-radius: 0 !important;
        display: flex;
        align-items: center;
    }
</style>
<form method="post" action="{% url 'dsr_send_email' %}">
    {% csrf_token %}
    <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">Customer</div>
        </div>
        {% render_field form.ds_customer id="ds_customer_modal" class="form-control" %}
    </div>

    <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">To</div>
        </div>
        <input type="text" id="recipient" name="recipient" class="form-control" value="{{ form_dsr_email.recipient.value }}" placeholder="Recipient emails">
    </div>
    <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">Message</div>
        </div>
        <textarea id="message" name="message" class="form-control" rows="6" placeholder="Enter email message">{{ form_dsr_email.message.value }}</textarea>
    </div>


    <div class="form-group">
        <button type="submit" class="btn btn-primary"><i class="fas fa-envelope-square"></i> Send Email</button>
    </div>
</form>

<script>
    function email_message_fn() {
     // Assign Django template variables to JavaScript variables
       var message = 	"Dear Customer,\n\n" +
                "Please find the DSR report attached.\n\n" +
                  "Regards,\n" +
                  "BVM Warehouse Team";

        // Set the consolidated message as the value of the form field with id 'message'
        document.getElementById("message").value = message;
        
        // Initialize Select2 for modal
        if ($.fn.select2) {
            $('#ds_customer_modal').select2({
                dropdownParent: $('#sendEmailModal'),
                width: '100%',
                theme: 'classic'
            });
        }

    }
</script>
{% endblock content %}
