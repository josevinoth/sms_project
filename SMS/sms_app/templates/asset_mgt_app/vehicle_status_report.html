{% extends "asset_mgt_app/base_1.html" %}
{% load widget_tweaks %}
{% load static %}
{% block content %}



<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@ttskch/select2-bootstrap4-theme@1.5.2/dist/select2-bootstrap4.min.css"
    rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


<div class="container-fluid d-flex justify-content-center py-3">
    <div class="rounded text-center bg-info shadow-box px-4 py-2">
        <h3>Vehicle Status Report</h3>
    </div>
</div>
<br>

<form method="GET" action="{% url 'vehicle_status_report' %}" class="row g-3 align-items-end justify-content-center">
    <div class="col-md-3">
        <label class="form-label fw-bold">Vehicle Number</label>
        <select name="vehicle_search" id="vehicle_number" class="form-control select2">
            <option value="">Search Vehicle...</option>
            {% for vehicle in all_vehicles %}
            <option value="{{ vehicle.vm_registrationnumber }}" {% if vehicle_search == vehicle.vm_registrationnumber %}selected{% endif %}>{{ vehicle.vm_registrationnumber }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label fw-bold">Branch</label>
        <select name="branch" class="form-control">
            <option value="">All</option>
            <option value="Chennai" {% if branch == "Chennai" %}selected{% endif %}>Chennai</option>
            <option value="Bengaluru" {% if branch == "Bengaluru" %}selected{% endif %}>Bengaluru</option>
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label fw-bold">From Date</label>
        <input type="date" name="from_date" value="{{ from_date }}" class="form-control">
    </div>
    <div class="col-md-2">
        <label class="form-label fw-bold">To Date</label>
        <input type="date" name="to_date" value="{{ to_date }}" class="form-control">
    </div>

    <div class="col-md-2">
        <button type="submit" class="btn btn-primary">Filter</button>
        <a href="{% url 'vehicle_status_report' %}" class="btn btn-secondary">Clear</a>
    </div>
</form>
<br>

<div class="row">
    <div class="col-auto">
        <a href="{% url 'transport_reports' %}" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>

<br>

<div class="container-fluid shadow-box-table">
    <table id="vehicle_status_report_table" class="table table-striped table-bordered" style="width:100%">
        <thead class="thead-dark">
            <tr>
                {% for h in headers %}
                <th>{{ h }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data_rows %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
$(document).ready(function () {

    $('#vehicle_status_report_table').DataTable({

        scrollX: true,
        dom: 'lBfrtip',

        lengthMenu: [
            [10, 25, 50, 100, -1],
            [10, 25, 50, 100, "All"]
        ],

        pageLength: 10,

        buttons: [

            'copy',
            'csv',

            {
                extend: 'excelHtml5',
                title: 'Vehicle Status Report',
                customize: function (xlsx) {
                    let sheet = xlsx.xl.worksheets['sheet1.xml'];
                    let styles = xlsx.xl['styles.xml'];

                    let fonts = $('fonts', styles);
                    fonts.append(`
                        <font>
                            <sz val="11"/>
                            <color rgb="FFFFFFFF"/>
                            <name val="Calibri"/>
                            <b/>
                        </font>
                    `);

                    let fills = $('fills', styles);
                    fills.append(`
                        <fill>
                            <patternFill patternType="solid">
                                <fgColor rgb="FF0A3278"/>
                                <bgColor indexed="64"/>
                            </patternFill>
                        </fill>
                    `);

                    let cellXfs = $('cellXfs', styles);
                    cellXfs.append(`
                        <xf xfId="0" fontId="1" fillId="1" applyFont="1" applyFill="1"/>
                    `);

                    $('row:eq(1) c', sheet).attr('s', cellXfs.children().length - 1);
                }
            },

            {
                extend: 'pdfHtml5',
                orientation: 'landscape',
                title: 'Vehicle Status Report',
                customize: function (doc) {
                    doc.styles.tableHeader.fillColor = '#0A3278';
                    doc.styles.tableHeader.color = 'white';
                    doc.styles.tableHeader.bold = true;
                }
            },

            {
                extend: 'print',
                title: 'Vehicle Status Report',
                customize: function (win) {
                    $(win.document.body).find('thead th')
                        .css('background-color', '#0A3278')
                        .css('color', 'white')
                        .css('font-weight', 'bold');
                }
            }
        ],

        order: [[0, 'asc']]
    });

});
</script>
<script>
    $(document).ready(function () {
        $('#vehicle_number').select2({
            width: '100%',
            theme: 'bootstrap4',
            placeholder: 'Search Vehicle No',
            allowClear: true
        });
    });
</script>
{% endblock content %}
