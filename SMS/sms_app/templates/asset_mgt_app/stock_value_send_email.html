{% load widget_tweaks %}
{% block content %}
<!-- Email Form -->
<style>
    /* Fix Select2 alignment inside Bootstrap input-group */
    .input-group > .select2-container--classic {
        flex: 1 1 auto;
        width: 1% !important;
    }
    .select2-container--classic .select2-selection--single {
        height: 100% !important;
        border-top-left-radius: 0 !important;
        border-bottom-left-radius: 0 !important;
        display: flex;
        align-items: center;
    }
</style>
<form method="post" action="{% url 'stock_value_send_email_view' %}">
    {% csrf_token %}
    <input type="hidden" name="from_date" id="modal_from_date">
    <input type="hidden" name="to_date" id="modal_to_date">

    <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">Customer</div>
        </div>
        {% render_field form.ds_customer id="ds_customer_modal" class="form-control" %}
    </div>

    <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">To</div>
        </div>
        <input type="text" id="recipient" name="recipient" class="form-control"
            value="{{ form_dsr_email.recipient.value }}" placeholder="Recipient emails">
    </div>
    <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">Message</div>
        </div>
        <textarea id="message" name="message" class="form-control" rows="6"
            placeholder="Enter email message">{{ form_dsr_email.message.value }}</textarea>
    </div>


    <div class="form-group">
        <button type="submit" class="btn btn-primary"><i class="fas fa-envelope-square"></i> Send Email</button>
    </div>
</form>

<script>
    function email_message_fn() {
        // 1️⃣ Get the values from the main date inputs
        let fromDate = document.querySelector('input[name="from_date"]').value;
        let toDate = document.querySelector('input[name="to_date"]').value;

        // Put them into the hidden modal inputs
        document.getElementById('modal_from_date').value = fromDate;
        document.getElementById('modal_to_date').value = toDate;

        // 2️⃣ Set default message
        let message = "Dear Customer,\n\n" +
            "Please find the Stock Value report attached.\n\n" +
            "Regards,\n" +
            "BVM Warehouse Team";

        document.getElementById("message").value = message;
        
        // Initialize Select2 for modal
        if ($.fn.select2) {
            $('#ds_customer_modal').select2({
                dropdownParent: $('#sendEmailModal'),
                width: '100%',
                theme: 'classic'
            });
        }

    }
</script>


{% endblock content %}
