{% extends "asset_mgt_app/base_1.html" %}
{% load widget_tweaks %}

{% block content %}


<!-- Standardized Select2 pattern -->

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@ttskch/select2-bootstrap4-theme@1.5.2/dist/select2-bootstrap4.min.css"
    rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- ================= CLAIM PENDING REPORT ================= -->
<style>
    .dataTables_length, .dt-buttons {
        display: inline-block !important;
        vertical-align: middle !important;
        margin-bottom: 10px !important;
    }
    .dataTables_length {
        margin-right: 20px !important;
    }
    .dt-button {
        padding: 5px 12px !important;
        margin-right: 5px !important;
    }
</style>

<div class="container-fluid d-flex justify-content-between align-items-center py-3">
    <a href="{% url 'transport_reports' %}" class="btn btn-primary shadow-sm">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    <div class="rounded text-center bg-info shadow-box px-4 py-2 mx-auto">
        <h3>Maintenance Report-vehicle</h3>
    </div>
    <div style="width: 140px;"></div> <!-- Spacer to keep title centered -->
</div>

<form method="POST" class="row g-3 align-items-end justify-content-center" id="filterForm">
    {% csrf_token %}
    
    <!-- Vehicle Search -->
    <div class="col-md-2">
        <label class="form-label fw-bold">Vehicle No</label>
        <select name="vehicle_search" id="vehicle_search" class="form-control select2">
            <option value="">Search Vehicle No</option>
            {% for vehicle in all_vehicles %}
            <option value="{{ vehicle.vm_registrationnumber }}" {% if vehicle_search == vehicle.vm_registrationnumber %}selected{% endif %}>
                {{ vehicle.vm_registrationnumber }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- Branch Filter -->
    <div class="col-md-2">
        <label class="form-label fw-bold">Branch</label>
        <select name="branch" id="branch" class="form-control select2">
            <option value="">-- All Branches --</option>
            {% for branch in all_branches %}
            <option value="{{ branch.id }}" {% if branch.id|slugify == selected_branch_id|slugify %}selected{% endif %}>
                {{ branch.branch }}
            </option>
            {% endfor %}
        </select>
    </div>

    <!-- From Date -->
    <div class="col-md-2">
        <label class="form-label fw-bold">From Date</label>
        <input type="date" name="from_date" id="from_date" class="form-control" value="{{ from_date }}">
    </div>

    <!-- To Date -->
    <div class="col-md-2">
        <label class="form-label fw-bold">To Date</label>
        <input type="date" name="to_date" id="to_date" class="form-control" value="{{ to_date }}">
    </div>

    <!-- Buttons -->
    <div class="col-md-3">
        <button type="submit" class="btn btn-primary">Filter</button>
        <a href="{% url 'maintenance_report' %}" class="btn btn-secondary">Clear</a>
    </div>
</form>

<hr>

<div class="container-fluid">
    <div class="table-responsive shadow-box-table p-3">
        <table class="table table-striped table-bordered table-sm" id="maintenance_report_table">
            <thead class="thead-dark">
                <tr>
                    {% for header in headers %}
                    <th>{{ header }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in data_rows %}
                <tr>
                    {% for cell in row %}
                    <td>{{ cell }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>


</div>


<script>
    $(document).ready(function () {

        const table = $('#maintenance_report_table').DataTable({
            scrollX: true,
            autoWidth: false,
            dom: "<'row'<'col-sm-12 col-md-6'lB><'col-sm-12 col-md-6'f>>" +
                 "<'row'<'col-sm-12'tr>>" +
                 "<'row'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
            
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "All"]
            ],
            pageLength: 25,
            buttons: [
                {
                    extend: 'copy',
                    className: 'btn btn-sm btn-info'
                },
                {
                    extend: 'csv',
                    className: 'btn btn-sm btn-info'
                },
                {
                    extend: 'excelHtml5',
                    className: 'btn btn-sm btn-info',
                    text: 'Excel',
                    title: 'Maintenance Report-vehicle',
                    customize: function (xlsx) {
                        let sheet = xlsx.xl.worksheets['sheet1.xml'];
                        let styles = xlsx.xl['styles.xml'];
                        let fonts = $('fonts', styles);
                        fonts.append(`
                        <font>
                            <sz val="11"/>
                            <color rgb="FFFFFFFF"/>
                            <name val="Calibri"/>
                            <b/>
                        </font>
                    `);
                        let fontId = fonts.children().length - 1;
                        let fills = $('fills', styles);
                        fills.append(`
                        <fill>
                            <patternFill patternType="solid">
                                <fgColor rgb="FF0A3278"/>
                                <bgColor indexed="64"/>
                            </patternFill>
                        </fill>
                    `);
                        let fillId = fills.children().length - 1;
                        let cellXfs = $('cellXfs', styles);
                        cellXfs.append(`
                        <xf xfId="0"
                            fontId="${fontId}"
                            fillId="${fillId}"
                            borderId="0"
                            applyFont="1"
                            applyFill="1"/>
                    `);
                        let styleId = cellXfs.children().length - 1;
                        $('row:eq(1) c', sheet).attr('s', styleId);
                    }
                },
                {
                    extend: 'pdfHtml5',
                    className: 'btn btn-sm btn-info',
                    orientation: 'landscape',
                    pageSize: 'A4',
                    title: 'Maintenance Report-vehicle',
                    customize: function (doc) {
                        doc.styles.tableHeader.fillColor = '#0A3278';
                        doc.styles.tableHeader.color = 'white';
                        doc.styles.tableHeader.bold = true;
                    }
                },
                {
                    extend: 'print',
                    className: 'btn btn-sm btn-info',
                    title: 'Maintenance Report-vehicle',
                    customize: function (win) {
                        $(win.document.body).find('thead th')
                            .css('background-color', '#0A3278')
                            .css('color', 'white')
                            .css('font-weight', 'bold');
                    }
                }
            ],
            order: [[0, 'asc']]
        });

        // Handle window resize to adjust columns
        $(window).on('resize', function () {
            $('#maintenance_report_table').DataTable().columns.adjust();
        });

    });
</script>
<script>
    $(document).ready(function () {
        $('#vehicle_search').select2({
            width: '100%',
            theme: 'bootstrap4',
            placeholder: 'Search Vehicle No',
            allowClear: true
        });
    });
</script>


{% endblock %}
