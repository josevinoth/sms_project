<div class="container-fluid row">
    <div class="col-md-1.5">
        <a href="{% url 'sales_multiple_item_add' %}" id="add_dim_btn" class="btn btn-success btn-block btn-lg">
            <i class="fas fa-plus"></i> Insert
        </a>
    </div>
</div>
<hr>

<div class="container-fluid">
    <table id="customer_attach_list" class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Sales Number</th>
                <th>Date of Quote</th>
                <th>Quote Ref</th>
                <th>Rate Approval</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for sales in Salesmultipleitem_list %}
            <tr>
                <td>{{ sales.id }}</td>
                <td>{{ sales.sm_sales_num }}</td>
                <td>{{ sales.sm_Date_of_Quote }}</td>
                <td>{{ sales.sm_Quote_Ref }}</td>
                <td>{{ sales.sm_Rate_Approval }}</td>
                <td>
                    <a class="btn btn-primary" href="{% url 'sales_multiple_item_update' sales.id %}">
                        <i class="far fa-edit"></i>
                    </a>
                </td>
                <td>
                    <form action="{% url 'sales_multiple_item_delete' sales.id %}" method="post" onclick="return confirm('Are you sure?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
