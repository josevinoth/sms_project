{% block content %}
<!--<form method="POST" action="">

<div class="d-flex justify-content-center align-items-center" style="min-height: 30vh;">
	<div class="card text-white bg-info mb-3" style="width: 100%; max-width: 400px;">
		<div class="card-header text-center"><h4>Sign In</h4></div>
		<div class="card-body bg-light text-dark">
			<form method="POST">
				{% csrf_token %}
				<div class="input-group form-group mb-3">
					<div class="input-group-prepend">
						<span class="input-group-text" style="width: 40px;"><i class="fas fa-user-tie"></i></span>
					</div>
					<input type="text" class="form-control" placeholder="Employee ID" name="username" required>
				</div>

				<div class="input-group form-group mb-3">
					<div class="input-group-prepend">
						<span class="input-group-text" style="width: 40px;"><i class="fas fa-key"></i></span>
					</div>
					<input type="password" class="form-control" placeholder="Password" name="password" required>
				</div>
				<div class="text-center p-2">
					<button class="btn btn-success" type="submit"><i class="fa fa-thumbs-up"></i> Login</button>
				</div>
			</form>
			<br>
			<div class="message text-center">
				{% for message in messages %}
					<a {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</a>
				{% endfor %}
			</div>
		</div>
		<div class="card-footer text-center bg-light">
			<div class="text-dark">Don't have an account? <a href="{% url 'registration_page' %}">Sign Up</a></div>
			<div><a href="{% url 'password_reset' %}">Forgot your password?</a></div>
		</div>
	</div>
</div>
