<!DOCTYPE html>
<html lang="en">

<body>
{% if record %}
    <p>Next record to backfill: <strong>{{ record.wh_qr_rand_num }}</strong></p>
    <form method="post" action="{% url 'backfill_one_record' %}">
        {% csrf_token %}
        <button type="submit"> Backfill This Record</button>
    </form>
    <form method="post" action="{% url 'backfill_all_records' %}">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545; color: white;">🚀 Backfill All Remaining</button>
    </form>
{% else %}
    <p> All records have been backfilled.</p>
{% endif %}

{% if messages %}
    <ul>
        {% for message in messages %}
            <li style="color: green;">{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

</body>
</html>
