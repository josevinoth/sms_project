{% extends "asset_mgt_app/base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div style="display: flex; justify-content: space-around; align-items: center; margin-top: 20px;">
    <!-- Productivity Donut Chart -->
    <div>
        <h2 style="color:black;">Salesperson Productivity</h2>
        <canvas id="productivityDonut" width="300" height="300"></canvas>
    </div>

    <!-- Performance Donut Chart -->
    <div>
        <h2 style="color:black;">Salesperson Performance</h2>
        <canvas id="performanceDonut" width="300" height="300"></canvas>
    </div>
</div>

<script>
    // Chart data passed from backend
    const chartData = {{ chart_data|safe }};

    // Ensure chartData has correct keys for labels, productivity, and performance
    const productivityData = chartData.productivity_percentages;
    const performanceData = chartData.performance_percentages;
    const labels = chartData.labels;

    // Productivity Donut Chart
    const ctxProductivity = document.getElementById('productivityDonut').getContext('2d');
    new Chart(ctxProductivity, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                label: 'Productivity (%)',
                data: productivityData,
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'], // Customize as needed
                borderColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'],
                borderWidth: 1
            }]
        },
        options: {
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(tooltipItem) {
                            return `${tooltipItem.label}: ${tooltipItem.raw}%`;
                        }
                    }
                }
            }
        }
    });

    // Performance Donut Chart
    const ctxPerformance = document.getElementById('performanceDonut').getContext('2d');
    new Chart(ctxPerformance, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                label: 'Performance (%)',
                data: performanceData,
                backgroundColor: ['#4BC0C0', '#9966FF', '#FF9F40', '#FF6384', '#36A2EB'], // Customize as needed
                borderColor: ['#4BC0C0', '#9966FF', '#FF9F40', '#FF6384', '#36A2EB'],
                borderWidth: 1
            }]
        },
        options: {
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(tooltipItem) {
                            return `${tooltipItem.label}: ${tooltipItem.raw}%`;
                        }
                    }
                }
            }
        }
    });
</script>
{% endblock content %}
