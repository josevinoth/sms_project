<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if form.instance.pk %} Edit {% else %} Add {% endif %} Pre Gatein</title>

    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">

    <!-- FontAwesome for Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            width: 100%;
            font-weight: bold;
        }
        .form-label {
            font-weight: 600;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0px 0px 5px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h3 class="text-center mb-4">
            <i class="fas fa-truck"></i> {% if form.instance.pk %} Edit {% else %} Add {% endif %} Pre Gatein
        </h3>

        <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success btn-sm-2">
                    <i class="fas fa-save"></i> Save
                </button>
                <a href="{% url 'gatein_pre_mbl_list' %}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
            <br>

            <div class="mb-3">
                <label for="gatein_pre_number" class="form-label">Pre Gate-in ID</label>
                <input type="text" id="gatein_pre_number" name="gatein_pre_number" class="form-control"
                       value="{{ form.gatein_pre_number.value }}" readonly>
            </div>


            <!-- Location (BRANCH) -->
            <div class="mb-3">
                <label for="gatein_pre_branch" class="form-label">Branch</label>
                <select id="gatein_pre_branch" name="gatein_pre_branch" class="form-control" required>
                    <option value="">-- Select Branch --</option>
                    {% for Location in Location %}
                    <option value="{{ Location.id }}" 
                        {% if form.gatein_pre_branch.value == Location.id %}selected{% endif %}>
                        {{ Location }}
                    </option>
                    {% endfor %}
                </select>
                <div class="invalid-feedback">Please select a branch</div>
            </div>

            <!-- Status -->
            <div class="mb-3">
                <label for="gatein_pre_status" class="form-label">Status</label>
                <select id="gatein_pre_status" name="gatein_pre_status" class="form-control" required>
                    <option value="">-- Select Status --</option>
                    {% for Status in Status %}
                    <option value="{{ Status.id }}" 
                        {% if form.gatein_pre_status.value == Status.id %}selected{% endif %}>
                        {{ Status }}
                    </option>
                    {% endfor %}
                </select>
                <div class="invalid-feedback">Please select a status</div>
            </div>

            <!-- Attachment Upload (Shipment Details) -->
            <div class="mb-3">
                <label for="gatein_pre_shipment_att" class="form-label">Upload Attachment (Shipment Details)</label>
                <input type="file" id="gatein_pre_shipment_att" name="gatein_pre_shipment_att" class="form-control">
            </div>

            <!-- Attachment Upload (Customer Approval) -->
            <div class="mb-3">
                <label for="gatein_pre_cust_appr_att" class="form-label">Upload Attachment (Customer Approval)</label>
                <input type="file" id="gatein_pre_cust_appr_att" name="gatein_pre_cust_appr_att" class="form-control">
            </div>

            <input type="hidden" name="gatein_pre_updated_by" value="{{ user_id }}">

            <!-- Buttons -->
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success btn-sm-2">
                    <i class="fas fa-save"></i> Save
                </button>
                <a href="{% url 'gatein_pre_mbl_list' %}" class="btn btn-secondary btn-sm">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Form Validation Script -->
<script>
    (function () {
        'use strict';
        var forms = document.querySelectorAll('.needs-validation');
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>


<script>
$(document).ready(function() {
            {
                var gatein_pre_updated_by = document.getElementById("gatein_pre_updated_by").value
                if (gatein_pre_updated_by == "")
                {
                    document.getElementById("gatein_pre_updated_by").value='{{user_id}}'
                }
                else
                {
                    document.getElementById("gatein_pre_updated_by").value=updated_by;
                }
            }
        });
</script>

</body>
</html>
