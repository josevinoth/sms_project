{% extends "asset_mgt_app/base.html" %}


{% block content %}
<div class="container-fluid d-flex justify-content-center py-3">
    <div class="rounded text-center bg-info shadow-box px-4 py-2">
        <h3>Trip Closure </h3>
    </div>
</div>
<div class="container-fluid mt-3">
    <div class="row mb-3">
        <div class="col-md-1">
            <a href="{% url 'home_page' %}" class="btn btn-warning btn-block">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </div>
    <div class="card shadow mb-4">
        <div class="card-body">
            <form method="GET" class="form-row align-items-end">
                <div class="col-md-3">
                    <label for="branch" class="font-weight-bold">Branch</label>
                    <select name="branch" id="branch" class="form-control select2">
                        <option value="">-- All Branches --</option>
                        <option value="MAA" {% if branch == 'MAA' %}selected{% endif %}>MAA</option>
                        <option value="BLR" {% if branch == 'BLR' %}selected{% endif %}>BLR</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="trip_status" class="font-weight-bold">Trip Status</label>
                    <select name="trip_status" id="trip_status" class="form-control select2">
                        <option value="">-- All Status --</option>
                        {% for status in status_list %}
                        <option value="{{ status.id }}" {% if selected_status == status.id %}selected{% endif %}>{{ status.status }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="vehicle_source" class="font-weight-bold">Vehicle Source</label>
                    <select name="vehicle_source" id="vehicle_source" class="form-control select2">
                        <option value="">-- All Sources --</option>
                        {% for source in ownership_list %}
                        <option value="{{ source.id }}" {% if selected_vehicle_source == source.id|stringformat:'s' %}selected{% endif %}>{{ source.ow_ownership }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="date_from" class="font-weight-bold">From Date</label>
                    <input type="date" name="date_from" id="date_from" class="form-control" value="{{ date_from }}">
                </div>
                <div class="col-md-2">
                    <label for="date_to" class="font-weight-bold">To Date</label>
                    <input type="date" name="date_to" id="date_to" class="form-control" value="{{ date_to }}">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <a href="{% url 'tripclosure_list' %}" class="btn btn-secondary btn-block">
                        <i class="fas fa-undo"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="container-fluid">
    <table id="tripclosure_list" class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Created On</th>
                <th>Enquiry Number</th>
                <th>Consignment Number</th>
                <th>Trip Number</th>
                <th>Trip Cost</th>
                <th>Parking Cost</th>
                <th>Toll Cost</th>
                <th>Loading Cost</th>
                <th>Un-Loading Cost</th>
                <th>Weighment Cost</th>
                <th>Handling Cost</th>
                <th>POD</th>
                <th>Trip Status</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var params = new URLSearchParams(window.location.search);

        $('#tripclosure_list').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
                url: "{% url 'tripclosure_list_ajax' %}",
                data: function (d) {
                    d.branch = params.get('branch') || '';
                    d.trip_status = params.get('trip_status') || '';
                    d.vehicle_source = params.get('vehicle_source') || '';
                    d.date_from = params.get('date_from') || '';
                    d.date_to = params.get('date_to') || '';
                }
            },
            order: [[0, 'desc']],
            scrollX: true,
            pageLength: 50,
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "All"]
            ],
            columns: [
                { title: "Created On" },
                { title: "Enquiry Number" },
                { title: "Consignment Number" },
                { title: "Trip Number" },
                { title: "Trip Cost" },
                { title: "Parking Cost" },
                { title: "Toll Cost" },
                { title: "Loading Cost" },
                { title: "Un-Loading Cost" },
                { title: "Weighment Cost" },
                { title: "Handling Cost" },
                { title: "POD" },
                { title: "Trip Status" },
                { title: "Edit", orderable: false, searchable: false },
                { title: "Delete", orderable: false, searchable: false }
            ],
            columnDefs: [
                {
                    targets: 13,
                    render: function (data, type, row) {
                        return '<a class="btn btn-primary" href="/SMS/tripclosure_update/' + row[13] + '/"><i class="far fa-edit"></i></a>';
                    }
                },
                {
                    targets: 14,
                    render: function (data, type, row) {
                        return '<form action="/SMS/tripclosure_delete/' + row[13] + '/" method="post" onsubmit="return confirm(\'Are you sure?\');">' +
                            '<input type="hidden" name="csrfmiddlewaretoken" value="' + getCookie('csrftoken') + '">' +
                            '<button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i></button></form>';
                    }
                }
            ],
            dom: 'lBfrtip',
            buttons: ['copy', 'csv', 'excel', 'print']
        });
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock content %}
