{% extends "asset_mgt_app/base_modern.html" %}
{% block content %}
<div class="container-fluid py-4 bvm-modern-layout">
    <!-- ══ Centralized Page Header ══ -->
    <div class="modern-list-header mb-4" style="display: block !important; overflow: hidden;">
        <div class="row align-items-center">
            <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-boxes mr-2"></i> Warehouse Job List
                </h3>
            </div>
            <div class="col-12 col-md-6 d-flex flex-column flex-md-row justify-content-center justify-content-md-end">
                <a href="{% url 'home_page' %}" class="btn btn-cancel mb-2 mb-md-0 mr-md-2" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.5rem 1.2rem; font-size:0.9rem; text-decoration:none;">
                    <i class="fas fa-arrow-left mr-1"></i> Back
                </a>
                <a href="{% url 'gatein_insert' %}" class="btn btn-submit" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.5rem 1.2rem; font-size:0.9rem; text-decoration:none; background: linear-gradient(135deg, #fbbf24, #f59e0b); border: none; color: white;">
                    <i class="fas fa-plus mr-1"></i> Add New
                </a>
            </div>
        </div>
    </div>

    <!-- ══ Filter Form Section ══ -->
    <div class="form-section mb-4 p-4" style="background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <form action="{% url 'search' %}" method="get">
            <!-- Section Header -->
            <div class="form-section-title mb-3 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
                <div class="mb-2 mb-md-0"><i class="fas fa-filter text-primary"></i> FILTER OPTIONS</div>
            </div>

            <!-- Controls Row -->
            <div class="d-flex flex-wrap align-items-end" style="gap: 15px;">
                <div class="form-group-modern mb-0" style="flex: 1 1 200px;">
                    <label class="form-label-modern">Pre Gate-In</label>
                    <input type="search" class="form-control form-control-modern" id="pre_gate_in" placeholder="Pre Gate-In" name="pre_gate_in" value="{{ pre_gate_in }}">
                </div>

                <div class="form-group-modern mb-0" style="flex: 1 1 200px;">
                    <label class="form-label-modern">Job Number</label>
                    <input type="search" class="form-control form-control-modern" id="job_number" placeholder="Job Number" name="job_number" value="{{ job_number }}">
                </div>

                <div class="form-group-modern mb-0" style="flex: 1 1 200px;">
                    <label class="form-label-modern">Invoice Number</label>
                    <input type="search" class="form-control form-control-modern" id="invoice_number" placeholder="Invoice Number" name="invoice_number" value="{{ invoice_number }}">
                </div>

                <div class="d-flex align-items-center flex-wrap" style="gap: 10px; flex: 0 0 auto;">
                    <button type="submit" class="btn btn-submit" style="background: linear-gradient(135deg, #fbbf24, #f59e0b); border: none; color: white;">
                        <i class="fas fa-filter mr-1"></i> Filter
                    </button>
                    <a href="{% url 'gatein_list' %}" class="btn btn-cancel d-inline-flex align-items-center justify-content-center" style="text-decoration:none;">
                        <i class="fas fa-times mr-1"></i> Clear
                    </a>
                    <a href="{% url 'gatein_list' %}" class="btn btn-submit" style="background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none; color: white; display:inline-flex; align-items:center; justify-content:center; text-decoration:none;">
                        <i class="fas fa-eye mr-1"></i> Show All
                    </a>
                </div>
            </div>
        </form>
    </div>
<div class="table-container-modern p-4 mb-5">
<div class="table-responsive">
    <table id="gatein_list" class="table table-bordered modern-table w-100">
                <thead>
            <!-- Filter Row -->
            <tr>
                <th></th>
                <th></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search ID"></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Created On"></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Pre-Gate-In"></th>
                <th></th> <!-- Inward POD column: no search box -->
                <th></th> <!-- Gate pass column: no search box -->
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Job Number"></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Shipper Invoice Number"></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Customer Name"></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Updated On"></th>
                <th><input type="text" class="form-control filter-input-modern filter-input" placeholder="Search Updated By"></th>
                <th></th> <!-- Delete -->
            </tr>
            <!-- Header Row -->
            <tr>
                <th></th>
                <th>ACTION</th>
                <th>ID</th>
                <th>CREATED ON</th>
                <th>PRE-GATE_IN</th>
                <th>INWARD POD</th>
                <th>GATE PASS</th>
                <th>JOB NUMBER</th>
                <th>SHIPPER INVOICE NUMBER</th>
                <th>CUSTOMER NAME</th>
                <th>UPDATED ON</th>
                <th>UPDATED BY</th>
                <th>DELETE</th>
            </tr>
        </thead>
        <tbody>
        </tbody>

    </table>

</div>
<style>
    th.shipper-invoice-col,
    td.shipper-invoice-col {
        width: 150px;
        max-width: 150px;
        word-break: break-word;
        white-space: normal;
    }

    /* Increase the size of the column filter inputs (DataTables) */
    .filter-input-modern {
        min-width: 150px !important;
        height: 36px !important;
        font-size: 0.85rem !important;
        padding: 4px 10px !important;
        border-radius: 6px !important;
    }

    /* Increase the size of the top FILTER OPTIONS inputs to match reference design */
    .form-section .form-control-modern {
        height: 46px !important;
        min-height: 46px !important;
        font-size: 0.95rem !important;
        padding: 0.5rem 1rem !important;
        border-radius: 8px !important;
        border: 1px solid #94a3b8 !important;
        color: #334155 !important;
        box-shadow: none !important;
        font-weight: 700 !important; /* Thick font for text */
    }

    .form-section .form-control-modern::placeholder {
        color: #64748b !important;
        font-weight: 700 !important; /* Thick font for placeholder */
    }

    .form-section .form-label-modern {
        font-size: 0.75rem !important;
        font-weight: 800 !important;
        color: #0f172a !important;
        margin-bottom: 8px !important;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var table = $('#gatein_list').DataTable({
            order: [[2, 'desc']],
            scrollX: true,
            dom: 'lBfrtip',
            buttons: ['copy', 'csv', 'excel', 'print'],
            serverSide: true,
            processing: true,
            ajax: {
                url: "{% url 'gatein_list_ajax' %}",
                type: "GET",
                data: function(d) {
                    d.pre_gate_in = '{{ request.GET.pre_gate_in|default:"" }}';
                    d.job_number = '{{ request.GET.job_number|default:"" }}';
                    d.invoice_number = '{{ request.GET.invoice_number|default:"" }}';
                }
            },
            columns: [
                { data: null, defaultContent: '', orderable: false, searchable: false }, // Spacer
                { data: 'edit', orderable: false, searchable: false },
                { data: 'id' },
                { data: 'gatein_created_at' },
                { data: 'gatein_pre_id' },
                { data: 'inward_pod', orderable: false, searchable: false },
                { data: 'gatepass', orderable: false, searchable: false },
                { data: 'gatein_job_no' },
                { data: 'gatein_invoice' },
                { data: 'gatein_customer' },
                { data: 'gatein_updated_at' },
                { data: 'gatein_updated_by' },
                { data: 'delete', orderable: false, searchable: false }
            ]
        });

        // Apply search to each column
        $('.filter-input').on('keyup change', function () {
            var columnIndex = $(this).parent().index(); 
            // In DataTables, the column index matches the headers. Since the first row has the inputs,
            // we use that index.
            table.column(columnIndex).search(this.value).draw();
        });

        // Prevent sorting when clicking inside the filter input
        $('#gatein_list thead input').on('click', function(e) {
            e.stopPropagation();
        });
    });
</script>


</div>
{% endblock content %}
