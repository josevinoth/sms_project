<hr>

<div class="table-responsive">
    <table id="dg_cargo_list" class="table table-striped table-bordered nowrap">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Edit</th>
            <th>WH Job Number</th>
            <th>Location</th>
            <th>Approval Status</th>
            <th>Delete</th>
        </tr>
        </thead>
        <tbody>
        {% for cargo in dg_cargo_list %}
        <tr>
            <td>{{ cargo.id }}</td>
            <td>
                <a class="btn btn-primary" href="{% url 'dg_cargo_add' cargo.id %}">
                    <i class="far fa-edit"></i>
                </a>
            </td>
            <td>{{ cargo.DG_wh_job_no }}</td>
            <td>{{ cargo.DG_wh_location }}</td>
            <td>{{ cargo.DG_wh_approval_status }}</td>
            <td>
                <form action="{% url 'dg_cargo_delete' cargo.id %}" method="post" onclick="return confirm('Are you sure?');">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        $('#dg_cargo_list').DataTable({
            scrollY: "600px",
            scrollX: false,
            scrollCollapse: true,
            responsive: true,
            dom: 'lBfrtip',
            order: [0, 'desc'],
            buttons: [
                'copy', 'csv', 'excel', 'print'
            ]
        });
    });
</script>
