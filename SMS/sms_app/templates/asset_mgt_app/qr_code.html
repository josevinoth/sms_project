{% extends "asset_mgt_app/base.html" %}
{% load widget_tweaks %}
{% block content %}
{% load crispy_forms_tags %}
<!-- Content Container -->
<div id="content" class="bg-warning" style="width: 350px; margin: auto; padding: 1px; border: 4px solid black; text-align: left; font-family: Arial, sans-serif;">
    <div style="display: flex; align-items: center;">
        <!-- QR Code Section -->
        <div style="flex: 1; text-align: center;">
            <img src="{{ qr_code }}" alt="QR Code" style="width: 150px; height: 150px;">
        </div>
        <!-- Asset Information Section -->
        <div style="flex: 2; padding-left: 10px; font-size: 16px; line-height: 1.3;">
            <p style="margin: 0;"><strong>{{ Asset_Number }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_Assigned_To }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_Location }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_Product }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_ID }}</strong></p>
        </div>
    </div>
</div>

<!-- Print Button -->

        Print Asset Info

</div>
