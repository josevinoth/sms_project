{% extends "asset_mgt_app/base.html" %}
{% load widget_tweaks %}
{% block content %}
{% load crispy_forms_tags %}

<!-- On-Screen Display -->
<div id="content" class="print-label bg-warning" style="width:300px;padding: 1px; text-align: left; font-family: Arial, sans-serif;">
    <div style="display: flex; align-items: center;">
        <!-- QR Code -->
        <div style="text-align: center;">
            <img src="{{ qr_code }}" alt="QR Code" style="width: 100px; height: 100px;object-fit: contain;">
        </div>
        <!-- Asset Info -->
        <div style="flex: 1; padding-left: 8px; font-size: 14px; line-height: 1.2;">
            <p style="margin: 0;">{{ Asset_Number }}</p>
            <p style="margin: 0;">{{ Asset_Assigned_To }}</p>
            <p style="margin: 0;">{{ Asset_Location }}</p>
            <p style="margin: 0;">{{ Asset_Product }}</p>
            <p style="margin: 0;">{{ Asset_ID }}</p>
        </div>
    </div>
</div>

<!-- Print Button -->
<div style="text-align: center; margin-top: 10px;">
    <button onclick="printDiv()" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Print Asset Info
    </button>
</div>

<!-- Print Script -->
<script>
function printDiv() {
    const content = document.getElementById("content").outerHTML;
    const printWindow = window.open("", "_blank");
    printWindow.document.write(`
        <html>
            <head>
                <title>Print</title>
                <style>
                    @media print {
                        body {
                            margin: 0;
                            padding: 0;
                            width: 48mm;
                            height: 25mm;
                        }
<!--                        .print-label {-->
<!--                            display: flex;-->
<!--                            flex-direction: row;-->
<!--                            align-items: center;-->
<!--                            justify-content: space-between;-->
<!--                            width: 100%;-->
<!--                            height: 100%;-->
<!--                            padding: 2mm;-->
<!--                            box-sizing: border-box;-->
<!--                            border: 2px solid black;-->
<!--                            border-radius: 2mm;-->
<!--                            font-family: Arial, sans-serif;-->
<!--                            font-size: 2.8mm;-->
<!--                            background-color: white;-->
<!--                        }-->
                        .print-label img {
                            width: 15mm;
                            height: 15mm;
                            object-fit: contain;
                        }
                        .print-label p {
                            margin: 0;
                            padding: 0;
                            line-height: 1.1;
                            word-break: break-word;
                        }
                    }
                </style>
            </head>
            <body>
                ${content}
                <script>
                    const img = document.querySelector("img");
                    img.onload = () => window.print();
                    if (img.complete) window.print();
                <\/script>
            </body>
        </html>
    `);
    printWindow.document.close();
}
</script>

{% endblock content %}
