{% extends "asset_mgt_app/base.html" %}
{% load widget_tweaks %}
{% block content %}
{% load crispy_forms_tags %}
<!-- Content Container -->
<div id="content" class="bg-warning" style="width: 550px; margin: auto; padding: 1px; border: 4px solid black; text-align: left; font-family: Arial, sans-serif;">
    <div style="display: flex; align-items: center;">
        <!-- QR Code Section -->
        <div style="flex: 1; text-align: center;">
            <img src="{{ qr_code }}" alt="QR Code" style="width: 150px; height: 150px;">
        </div>
        <!-- Asset Information Section -->
        <div style="flex: 2; padding-left: 10px; font-size: 16px; line-height: 1.3;">
            <p style="margin: 0;"><strong>{{ Asset_Number }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_Assigned_To }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_Location }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_Product }}</strong></p>
            <p style="margin: 0;"><strong>{{ Asset_ID }}</strong></p>
        </div>
    </div>
</div>

<!-- Print Button -->
<div style="text-align: center; margin-top: 10px;">
    <button onclick="printDiv()" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Print Asset Info
    </button>
</div>

<!-- Print Function -->
<script>
    function printDiv() {
        const content = document.getElementById("content").outerHTML;
        const printWindow = window.open("", "_blank");
        printWindow.document.write(`
            <html>
                <head>
                    <title>Print</title>
                    <style>
    @media print {
        body {
            margin: 0;
            padding: 0;
            width: 48mm;
            height: 25mm;
            background-color: white;
        }
        #content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2mm; /* Add padding to prevent overflow */
            border: 3px solid black;
            border-radius: 3.2mm;
            background-color: #add8e6;
            box-sizing: border-box; /* Include padding in width/height calculations */
            font-family: Arial, sans-serif;
            font-size: 4mm; /* Adjusted for readability */
            text-align: left;
        }
        .qr-container {
            display: flex;
            align-items: center;
            gap: 2mm;
        }
        .qr-container img {
            width: 12mm; /* Ensure the QR code fits properly */
            height: 12mm;
        }
        .text-container {
            max-width: calc(100% - 14mm); /* Prevent overflow */
            line-height: 1.2;
            word-wrap: break-word;
        }
    }
</style>

                </head>
                <body>${content}</body>
            </html>
        `);
        printWindow.document.close();
        printWindow.print();
    }
</script>


{% endblock content %}
