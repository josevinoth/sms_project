{% extends "asset_mgt_app/base.html" %}
{% load widget_tweaks %}
{% block content %}
{% load crispy_forms_tags %}
<!-- Content Container -->
<div id="content" style="width: 550px; margin: auto; padding: 10px; border: 1px solid black; background-color: #add8e6; text-align: left; font-family: Arial, sans-serif;">
    <div style="display: flex; align-items: center;">
        <!-- QR Code Section -->
        <div style="flex: 1; text-align: center;">
            <img src="{{ qr_code }}" alt="QR Code" style="width: 150px; height: 150px;">
        </div>
        <!-- Asset Information Section -->
        <div style="flex: 2; padding-left: 10px; font-size: 14px; line-height: 1.4;">
            <p style="margin: 0;">Asset Number: <strong>{{ Asset_Number }}</strong></p>
            <p style="margin: 0;">Assigned To: <strong>{{ Asset_Assigned_To }}</strong></p>
            <p style="margin: 0;">Location: <strong>{{ Asset_Location }}</strong></p>
            <p style="margin: 0;">Product: <strong>{{ Asset_Product }}</strong></p>
            <p style="margin: 0;">Asset ID: <strong>{{ Asset_ID }}</strong></p>
        </div>
    </div>
</div>

<!-- Print Button -->
<div style="text-align: center; margin-top: 10px;">
    <button onclick="printDiv()" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Print Asset Info
    </button>
</div>

<!-- Print Function -->
<script>
function printDiv() {
    const content = document.getElementById("content").outerHTML;
    const printWindow = window.open("", "_blank");
    printWindow.document.write(`
        <html>
            <head>
                <title>Print</title>
                <style>
                    body {
                        margin: 0;
                        padding: 0;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        background-color: white;
                    }
                    #content {
                        width: 350px;
                        padding: 10px;
                        border: 1px solid black;
                        background-color: #add8e6;
                        font-family: Arial, sans-serif;
                        font-size: 14px;
                        line-height: 1.4;
                        display: flex;
                        flex-wrap: wrap; /* Ensure content wraps if needed */
                        gap: 10px; /* Add spacing between elements */
                    }
                    img {
                        width: 150px;
                        height: 150px;
                        margin-bottom: 10px; /* Add bottom margin to space out images */
                    }
                </style>
            </head>
            <body>${content}</body>
        </html>
    `);
    printWindow.document.close();
    printWindow.print();
}
</script>

{% endblock content %}
