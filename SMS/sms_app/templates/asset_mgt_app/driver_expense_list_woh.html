<div class="container-fluid mt-4">
    <div class="card border-info">
        <div class="card-header bg-info text-center text-white">
            <h3>Driver Expense List</h3>
            <a href="{% url 'driver_expense_add' %}?settlement_id={{ form.instance.id }}&next={{ request.path }}"
               class="btn btn-success btn-sm float-right">
                <i class="fas fa-plus"></i> Add Expense
            </a>

        </div>

        <div class="card-body bg-light">
            <table id="driver_expense_list" class="table table-striped table-bordered">
                <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Driver Name</th>
                    <th>Driver ID</th>
                    <th>Expense Type</th>
                    <th>Parking</th>
                    <th>Loading</th>
                    <th>Unloading</th>
                    <th>Weighment</th>
                    <th>Supervisor</th>
                    <th>Total Cost</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
</div>

<!-- ================= SCRIPTS ================= -->

<script>
    $(document).ready(function () {
        $('#driver_expense_list').DataTable({
            order: [[0, 'desc']],
            destroy: true
        });
    });
</script>
