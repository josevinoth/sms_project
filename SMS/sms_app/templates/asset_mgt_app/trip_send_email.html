{% load widget_tweaks %}
{% block content %}
<!-- Email Form -->
<form method="post" action="{% url 'trip_email' %}">
    {% csrf_token %}
       <div class="input-group mb-2 mr-sm-2">
        <div class="input-group-prepend">
            <div class="input-group-text">To</div>
        </div>
        <input type="text" id="recipient" name="recipient" class="form-control" value="{{ form_dsr_email.recipient.value }}" placeholder="Recipient emails">
    </div>
    <div class="row">
        <div class="col-1"></div>
        <div class="col-10">
            <div class="message text-center">
                {% for message in messages %}
                <a {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</a>
                {% endfor %}
            </div>
        </div>
        <div class="col-1"></div>
    </div>

    <div class="form-group">
        <button type="submit" class="btn btn-primary"><i class="fas fa-envelope-square"></i> Send Email</button>
    </div>
</form>

<script>
    function email_message_fn() {
     // Assign Django template variables to JavaScript variables
       var message = 	"Dear Customer,\n\n" +
                "Please find below the trip details:.\n\n" +
                  "Regards,\n" +
                  "BVM Warehouse Team";

        // Set the consolidated message as the value of the form field with id 'message'
        document.getElementById("message").value = message;
    }
</script>
{% endblock content %}
