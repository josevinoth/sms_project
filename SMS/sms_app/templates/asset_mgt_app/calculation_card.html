{% load widget_tweaks %}

{% block content %}
<div class="pms-sticky-calculation">
    <div class="modern-card" style="padding: 1.2rem; border-top: 4px solid var(--accent-orange);">
        <div class="form-section-title text-center mb-4" style="color: var(--accent-orange); border-bottom: 2px solid var(--border-light); padding-bottom: 10px;">
            <h4><i class="fas fa-calculator"></i> Calculator</h4>
        </div>
        
        <div id="dimension_type">
            <!-- Dimension Type Field -->
            <div class="form-group-modern mb-3">
                <label class="form-label-modern text-dark small text-uppercase font-weight-bold">Dimension Type</label>
                <input type="text" id="pkqt_dimension_type" class="form-control form-control-modern disable_a_href text-center font-weight-bold" style="color: var(--accent-emerald) !important;">
            </div>

            <input type="text" id="pkqt_dimension_type_id" class="form-control" style="display: none;">

            <div class="row">
                <div class="col-12 mb-2">
                    <div class="form-group-modern">
                        <label class="form-label-modern text-dark small text-uppercase font-weight-bold">UOM</label>
                        <input type="text" id="pkqt_uom_calc" class="form-control form-control-modern disable_a_href text-center font-weight-bold">
                    </div>
                </div>
                <div class="col-4 pr-1">
                    <div class="form-group-modern">
                        <label class="form-label-modern text-dark small text-center w-100 font-weight-bold">L</label>
                        <input type="number" id="pkqt_l" class="form-control form-control-modern disable_a_href text-center">
                    </div>
                </div>
                <div class="col-4 px-1">
                    <div class="form-group-modern">
                        <label class="form-label-modern text-dark small text-center w-100 font-weight-bold">W</label>
                        <input type="number" id="pkqt_w" class="form-control form-control-modern disable_a_href text-center">
                    </div>
                </div>
                <div class="col-4 pl-1">
                    <div class="form-group-modern">
                        <label class="form-label-modern text-dark small text-center w-100 font-weight-bold">H</label>
                        <input type="number" id="pkqt_h" class="form-control form-control-modern disable_a_href text-center">
                    </div>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6 pr-1">
                    <div class="p-2" style="background: var(--bg-section); border-radius: 8px; border: 1px dashed var(--accent-orange);">
                        <div class="text-center small font-weight-bold mb-2" style="color: var(--accent-orange);">ID Clearance</div>
                        <div class="input-group input-group-sm mb-2 shadow-sm">
                            <input type="number" id="pkqt_box_id_clearance_l" class="form-control form-control-modern text-center" value="0" placeholder="L">
                        </div>
                        <div class="input-group input-group-sm mb-2 shadow-sm">
                            <input type="number" id="pkqt_box_id_clearance_w" class="form-control form-control-modern text-center" value="0" placeholder="W">
                        </div>
                        <div class="input-group input-group-sm mb-0 shadow-sm">
                            <input type="number" id="pkqt_box_id_clearance_h" class="form-control form-control-modern text-center" value="0" placeholder="H">
                        </div>
                    </div>
                </div>
                <div class="col-6 pl-1">
                    <div class="p-2" style="background: var(--bg-section); border-radius: 8px; border: 1px dashed var(--accent-blue);">
                        <div class="text-center small font-weight-bold mb-2" style="color: var(--accent-blue);">OD Clearance</div>
                        <div class="input-group input-group-sm mb-2 shadow-sm">
                            <input type="number" id="pkqt_box_od_clearance_l" class="form-control form-control-modern text-center" value="0" placeholder="L">
                        </div>
                        <div class="input-group input-group-sm mb-2 shadow-sm">
                            <input type="number" id="pkqt_box_od_clearance_w" class="form-control form-control-modern text-center" value="0" placeholder="W">
                        </div>
                        <div class="input-group input-group-sm mb-0 shadow-sm">
                            <input type="number" id="pkqt_box_od_clearance_h" class="form-control form-control-modern text-center" value="0" placeholder="H">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table to display calculated values -->
            <div class="mt-4 text-center font-weight-bold" style="color: var(--text-main); letter-spacing: 0.5px; border-bottom: 2px solid var(--border-light); padding-bottom: 5px; font-size: 0.85rem;">BOX OD DIMENSIONS</div>
            <div class="table-responsive mt-2">
                <table class="table table-sm table-borderless text-center mb-0" style="background: var(--bg-section); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light);">
                    <thead>
                    <tr style="background: var(--accent-emerald); color: #fff;">
                        <th class="font-weight-normal py-2 small">Unit</th>
                        <th class="font-weight-normal py-2 small">L</th>
                        <th class="font-weight-normal py-2 small">W</th>
                        <th class="font-weight-normal py-2 small">H</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr style="border-bottom: 1px solid var(--border-light);">
                        <td class="font-weight-bold align-middle small" style="background: var(--bg-card); color: var(--text-main); border-right: 1px solid var(--border-light);">cm</td>
                        <td><input type="text" id="length_cm" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                        <td><input type="text" id="width_cm" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                        <td><input type="text" id="height_cm" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                    </tr>
                    <tr style="border-bottom: 1px solid var(--border-light);">
                        <td class="font-weight-bold align-middle small" style="background: var(--bg-card); color: var(--text-main); border-right: 1px solid var(--border-light);">inch</td>
                        <td><input type="text" id="length_in" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                        <td><input type="text" id="width_in" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                        <td><input type="text" id="height_in" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                    </tr>
                    <tr>
                        <td class="font-weight-bold align-middle small" style="background: var(--bg-card); color: var(--text-main); border-right: 1px solid var(--border-light);">feet</td>
                        <td><input type="text" id="length_ft" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                        <td><input type="text" id="width_ft" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                        <td><input type="text" id="height_ft" class="form-control form-control-sm text-center border-0 bg-transparent font-weight-bold" style="color: var(--text-main) !important;" readonly></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Quantity and Sqft Table -->
            <div class="table-responsive mt-3">
                <table class="table table-sm table-borderless text-center" style="background: var(--bg-section); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light);">
                    <thead>
                    <tr style="background: var(--accent-orange); color: #fff;">
                        <th class="font-weight-normal py-2 small">Qty</th>
                        <th class="font-weight-normal py-2 small">Sq.ft</th>
                        <th class="font-weight-normal py-2 small">Total Sq.ft</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td class="p-2"><input type="number" class="form-control form-control-modern text-center font-weight-bold" id="quantity" onchange="calculateTotalSqft()"></td>
                        <td class="p-2"><input type="text" class="form-control form-control-modern text-center bg-transparent" style="color: var(--text-main) !important;" id="sqft" readonly></td>
                        <td class="p-2"><input type="text" class="form-control form-control-modern text-center font-weight-bold" style="color: var(--accent-emerald) !important; background: transparent;" id="total_sqft" readonly></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Button to trigger calculation -->
            <div class="mt-4">
                <button class="btn-modern btn-submit w-100 shadow" style="background: linear-gradient(135deg, var(--accent-orange), #e65100); border: none;" onclick="run_all_calculations()">
                    <i class="fas fa-sync-alt mr-2"></i> RE-CALCULATE
                </button>
            </div>
        </div>
    </div>
</div>

<style>
/* Custom scrollbar for the sticky container */
.pms-sticky-calculation::-webkit-scrollbar { width: 4px; }
.pms-sticky-calculation::-webkit-scrollbar-track { background: transparent; }
.pms-sticky-calculation::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 10px; }
.pms-sticky-calculation::-webkit-scrollbar-thumb:hover { background: var(--secondary-cyan); }
</style>

<script>
	document.addEventListener("DOMContentLoaded", function() {
        let inputFields = [
            "pkqt_dimension_type", "pkqt_dimension_type_id", "pkqt_uom_calc",
            "pkqt_l", "pkqt_w", "pkqt_h",
            "pkqt_box_id_clearance_l", "pkqt_box_id_clearance_w", "pkqt_box_id_clearance_h",
            "pkqt_box_od_clearance_l", "pkqt_box_od_clearance_w", "pkqt_box_od_clearance_h",
            "length_cm", "width_cm", "height_cm",
            "length_in", "width_in", "height_in",
            "length_ft", "width_ft", "height_ft",
            "quantity", "sqft", "total_sqft"
        ];

        inputFields.forEach(id => {
            let savedValue = localStorage.getItem(id);
            if (savedValue !== null) {
                let el = document.getElementById(id);
                if(el) el.value = savedValue;
            }
        });

        inputFields.forEach(id => {
            let el = document.getElementById(id);
            if(el) {
                el.addEventListener("input", function() {
                    localStorage.setItem(id, this.value);
                });
            }
        });
    });
</script>
<script>
    function pk_store_na_dimension_id() {
        var l = parseFloat(document.getElementById("pkqt_l").value);
        var w = parseFloat(document.getElementById("pkqt_w").value);
        var h = parseFloat(document.getElementById("pkqt_h").value);
        var uom_val = document.getElementById("pkqt_uom_calc").value;
        calculateDimensions(uom_val, l, w, h);
    }

    function calculateDimensions(na_uom_id_val, l, w, h) {
        if (!na_uom_id_val) return; // Prevent crash if UOM is missing
        var UOM = parseInt(na_uom_id_val);
        
        // Ensure l, w, h are numbers
        l = parseFloat(l) || 0;
        w = parseFloat(w) || 0;
        h = parseFloat(h) || 0;

        var box_id_clearance_l_el = document.getElementById("pkqt_box_id_clearance_l");
        var box_id_clearance_w_el = document.getElementById("pkqt_box_id_clearance_w");
        var box_id_clearance_h_el = document.getElementById("pkqt_box_id_clearance_h");
        var box_od_clearance_l_el = document.getElementById("pkqt_box_od_clearance_l");
        var box_od_clearance_w_el = document.getElementById("pkqt_box_od_clearance_w");
        var box_od_clearance_h_el = document.getElementById("pkqt_box_od_clearance_h");

        var box_id_clearance_l = box_id_clearance_l_el ? (parseFloat(box_id_clearance_l_el.value) || 0) : 0;
        var box_id_clearance_w = box_id_clearance_w_el ? (parseFloat(box_id_clearance_w_el.value) || 0) : 0;
        var box_id_clearance_h = box_id_clearance_h_el ? (parseFloat(box_id_clearance_h_el.value) || 0) : 0;
        var box_od_clearance_l = box_od_clearance_l_el ? (parseFloat(box_od_clearance_l_el.value) || 0) : 0;
        var box_od_clearance_w = box_od_clearance_w_el ? (parseFloat(box_od_clearance_w_el.value) || 0) : 0;
        var box_od_clearance_h = box_od_clearance_h_el ? (parseFloat(box_od_clearance_h_el.value) || 0) : 0;

        let l_cm = l + box_id_clearance_l + box_od_clearance_l;
        let w_cm = w + box_id_clearance_w + box_od_clearance_w;
        let h_cm = h + box_id_clearance_h + box_od_clearance_h;

        if (UOM === 2) { // INCH TO CM
            l_cm = (l + box_id_clearance_l + box_od_clearance_l) * 2.54;
            w_cm = (w + box_id_clearance_w + box_od_clearance_w) * 2.54;
            h_cm = (h + box_id_clearance_h + box_od_clearance_h) * 2.54;
        }

        document.getElementById("length_cm").value = l_cm.toFixed(2);
        document.getElementById("width_cm").value = w_cm.toFixed(2);
        document.getElementById("height_cm").value = h_cm.toFixed(2);

        document.getElementById("length_in").value = (l_cm / 2.54).toFixed(2);
        document.getElementById("width_in").value = (w_cm / 2.54).toFixed(2);
        document.getElementById("height_in").value = (h_cm / 2.54).toFixed(2);

        document.getElementById("length_ft").value = (l_cm / 30.48).toFixed(2);
        document.getElementById("width_ft").value = (w_cm / 30.48).toFixed(2);
        document.getElementById("height_ft").value = (h_cm / 30.48).toFixed(2);

        calculateTotalSqft();
    }

    function calculateTotalSqft() {
        var length_ft = parseFloat(document.getElementById("length_ft").value) || 0;
        var height_ft = parseFloat(document.getElementById("height_ft").value) || 0;
        var width_ft = parseFloat(document.getElementById("width_ft").value) || 0;
        var quantityInput = document.getElementById("quantity");
        var quantity = parseInt(quantityInput.value);
        if (isNaN(quantity) || quantity <= 0) { quantity = 1; quantityInput.value = 1; }
        var sqft = (length_ft * height_ft * 2)+(height_ft * width_ft * 2)+(length_ft * width_ft * 2);
        document.getElementById("sqft").value = sqft.toFixed(2);
        var total_sqft = sqft * quantity;
        document.getElementById("total_sqft").value = total_sqft.toFixed(2);
    }

    function run_all_calculations() {
        pk_store_na_dimension_id();
        pk_store_po_dimension_id();
    }
</script>
{% endblock %}
