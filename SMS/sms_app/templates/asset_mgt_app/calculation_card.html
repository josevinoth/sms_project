{% load widget_tweaks %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header bg-warning text-dark text-center"><h3>Calculation</h3></div>
                <div class="card-body" id="dimension_type">

                    <!-- Dimension Type Field -->
                    <div class="input-group input-group-sm mb-3">
                        <div class="input-group-prepend">
                            <span class="input-group-text">Dimension Type</span>
                        </div>
                        <input type="text" id="pkqt_dimension_type" class="form-control disable_a_href">
                    </div>

                    <input type="text" id="pkqt_dimension_type_id" class="form-control" style="display: none;">

                    <div class="row">
                        <div class="col-6">

                            <!-- UOM Field -->
                            <div class="input-group input-group-sm mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">UOM</span>
                                </div>
                                <input type="text" id="pkqt_uom_calc" class="form-control disable_a_href">
                            </div>

                            <!-- Input fields for Length, Width, Height -->
                            <div class="input-group input-group-sm mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Length</span>
                                </div>
                                <input type="number" id="pkqt_l" class="form-control disable_a_href">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="input-group input-group-sm mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Width</span>
                                </div>
                                <input type="number" id="pkqt_w" class="form-control disable_a_href">
                            </div>

                            <div class="input-group input-group-sm mb-3">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Height</span>
                                </div>
                                <input type="number" id="pkqt_h" class="form-control disable_a_href">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <fieldset style="width:100%;margin-left:10%">
                                <legend style="white-space: nowrap;">Box ID Clearance</legend>
                                <div class="mb-3">
                                    <div class="input-group input-group-sm mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">Length:</span>
                                        </div>
                                        <input type="number" id="pkqt_box_id_clearance_l" class="form-control" value="0">
                                    </div>

                                    <div class="input-group input-group-sm mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">Width:</span>
                                        </div>
                                        <input type="number" id="pkqt_box_id_clearance_w" class="form-control" value="0">
                                    </div>

                                    <div class="input-group input-group-sm mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">Height:</span>
                                        </div>
                                        <input type="number" id="pkqt_box_id_clearance_h" class="form-control" value="0">
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                        <div class="col-6">
                            <fieldset style="width:100%;margin-left:-10%">
                                <legend style="white-space: nowrap;">Box OD Clearance</legend>
                                <div class="mb-3">
                                    <div class="input-group input-group-sm mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">Length:</span>
                                        </div>
                                        <input type="number" id="pkqt_box_od_clearance_l" class="form-control" value="0">
                                    </div>

                                    <div class="input-group input-group-sm mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">Width:</span>
                                        </div>
                                        <input type="number" id="pkqt_box_od_clearance_w" class="form-control" value="0">
                                    </div>

                                    <div class="input-group input-group-sm mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">Height:</span>
                                        </div>
                                        <input type="number" id="pkqt_box_od_clearance_h" class="form-control" value="0">
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <!-- Table to display calculated values -->
                    <h3 class="text-center" style="text-decoration: underline;">Box OD Dimensions</h3>
                    <table class="table table-sm table-bordered">
                        <thead>
                        <tr class="text-center bg-warning">
                            <th></th>
                            <th>Length</th>
                            <th>Width</th>
                            <th>Height</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td class="bg-warning">cm</td>
                            <td><input type="text" id="length_cm" class="form-control form-control-sm" readonly></td>
                            <td><input type="text" id="width_cm" class="form-control form-control-sm" readonly></td>
                            <td><input type="text" id="height_cm" class="form-control form-control-sm" readonly></td>
                        </tr>
                        <tr>
                            <td class="bg-warning">inch</td>
                            <td><input type="text" id="length_in" class="form-control form-control-sm" readonly></td>
                            <td><input type="text" id="width_in" class="form-control form-control-sm" readonly></td>
                            <td><input type="text" id="height_in" class="form-control form-control-sm" readonly></td>
                        </tr>
                        <tr>
                            <td class="bg-warning">feet</td>
                            <td><input type="text" id="length_ft" class="form-control form-control-sm" readonly></td>
                            <td><input type="text" id="width_ft" class="form-control form-control-sm" readonly></td>
                            <td><input type="text" id="height_ft" class="form-control form-control-sm" readonly></td>
                        </tr>
                        </tbody>
                    </table>

                    <!-- Quantity and Sqft Table -->
                    <table class="table table-sm table-bordered">
                        <thead>
                        <tr class="text-center bg-warning">
                            <th>Quantity</th>
                            <th>Sq.ft</th>
                            <th>Total Sq.ft</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td><input type="number" class="form-control" id="quantity" onchange="calculateTotalSqft()"></td>
                            <td><input type="text" class="form-control" id="sqft" readonly></td>
                            <td><input type="text" class="form-control" id="total_sqft" readonly></td>
                        </tr>
                        </tbody>
                    </table>

                    <!-- Button to trigger calculation -->
                    <div class="d-flex justify-content-end mt-3">
                        <button class="btn btn-primary" onclick="run_all_calculations()">Calculate</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>


    function pk_store_na_dimension_id() {
        var l = parseFloat(document.getElementById("pkqt_l").value);
        var w = parseFloat(document.getElementById("pkqt_w").value);
        var h = parseFloat(document.getElementById("pkqt_h").value);
        var uom_val = document.getElementById("pkqt_uom_calc").value;

        calculateDimensions(uom_val, l, w, h);
    }

    function calculateDimensions(na_uom_id_val, l, w, h) {
        var dimension_type = parseInt(document.getElementById("pkqt_dimension_type_id").value);
        var UOM = parseInt(na_uom_id_val);

        var box_id_clearance_l = parseFloat(document.getElementById("pkqt_box_id_clearance_l").value) || 0;
        var box_id_clearance_w = parseFloat(document.getElementById("pkqt_box_id_clearance_w").value) || 0;
        var box_id_clearance_h = parseFloat(document.getElementById("pkqt_box_id_clearance_h").value) || 0;
        var box_od_clearance_l = parseFloat(document.getElementById("pkqt_box_od_clearance_l").value) || 0;
        var box_od_clearance_w = parseFloat(document.getElementById("pkqt_box_od_clearance_w").value) || 0;
        var box_od_clearance_h = parseFloat(document.getElementById("pkqt_box_od_clearance_h").value) || 0;

        // Perform dimension calculations based on the selected UOM
        let l_cm = l + box_id_clearance_l + box_od_clearance_l;
        let w_cm = w + box_id_clearance_w + box_od_clearance_w;
        let h_cm = h + box_id_clearance_h + box_od_clearance_h;

        if (UOM === 1) { // CM
            l_cm = l + box_id_clearance_l + box_od_clearance_l;
            w_cm = w + box_id_clearance_w + box_od_clearance_w;
            h_cm = h + box_id_clearance_h + box_od_clearance_h;
        } else if (UOM === 2) { // INCH
            l_cm = l * 2.54 + box_id_clearance_l * 2.54 + box_od_clearance_l * 2.54;
            w_cm = w * 2.54 + box_id_clearance_w * 2.54 + box_od_clearance_w * 2.54;
            h_cm = h * 2.54 + box_id_clearance_h * 2.54 + box_od_clearance_h * 2.54;
        }

        // Set the calculated values in the respective fields
        document.getElementById("length_cm").value = l_cm.toFixed(2);
        document.getElementById("width_cm").value = w_cm.toFixed(2);
        document.getElementById("height_cm").value = h_cm.toFixed(2);

        // Convert to inches and feet as well
        document.getElementById("length_in").value = (l_cm / 2.54).toFixed(2);
        document.getElementById("width_in").value = (w_cm / 2.54).toFixed(2);
        document.getElementById("height_in").value = (h_cm / 2.54).toFixed(2);

        document.getElementById("length_ft").value = (l_cm / 30.48).toFixed(2);
        document.getElementById("width_ft").value = (w_cm / 30.48).toFixed(2);
        document.getElementById("height_ft").value = (h_cm / 30.48).toFixed(2);

        calculateTotalSqft();
    }

    function calculateTotalSqft() {
    var length_ft = parseFloat(document.getElementById("length_ft").value) || 0;
    var width_ft = parseFloat(document.getElementById("width_ft").value) || 0;

    var quantityInput = document.getElementById("quantity");
    var quantity = parseInt(quantityInput.value);

    if (isNaN(quantity) || quantity <= 0) {
        quantity = 1;
        quantityInput.value = 1;  // Update the input field to show 1
    }

    // Calculate Sqft per box
    var sqft = length_ft * width_ft;
    document.getElementById("sqft").value = sqft.toFixed(2);

    // Calculate Total Sqft
    var total_sqft = sqft * quantity;
    document.getElementById("total_sqft").value = total_sqft.toFixed(2);
}

    function run_all_calculations() {
    pk_store_na_dimension_id();
    pk_store_po_dimension_id();
}

</script>
{% endblock %}
