{% load widget_tweaks %} <!-- This line loads the widget_tweaks tag library -->
{% block content %}

<div class="container">
	<div class="row">
		<div class="col">
			<div class="card ">
				<div class="card-header bg-warning text-dark text-center"><h3>Calculation</h3></div>
				<div class="card-body" id="dimension_type">

					<!-- Dimension Type Field -->
					<div class="input-group input-group-sm mb-3">
						<div class="input-group-prepend">
							<span class="input-group-text">Dimension Type</span>
						</div>
						<input type="text" id="pkqt_dimension_type" class="form-control disable_a_href">
					</div>

					<input type="text" id="pkqt_dimension_type_id" class="form-control" style="display: none;">
					<div class="row">
						<div class="col-6">

							<!-- UOM Field -->
							<div class="input-group input-group-sm mb-3">
								<div class="input-group-prepend">
									<span class="input-group-text">UOM</span>
								</div>
								<input type="text" id="pkqt_uom_calc" class="form-control disable_a_href">
							</div>

							<!-- Input fields for Length, Width, Height -->
							<div class="input-group input-group-sm mb-3">
								<div class="input-group-prepend">
									<span class="input-group-text">Length</span>
								</div>
								<input type="number" id="pkqt_l" class="form-control disable_a_href">
							</div>
						</div>
						<div class="col-6">
							<div class="input-group input-group-sm mb-3">
								<div class="input-group-prepend">
									<span class="input-group-text">Width</span>
								</div>
								<input type="number" id="pkqt_w" class="form-control disable_a_href">
							</div>

							<div class="input-group input-group-sm mb-3">
								<div class="input-group-prepend">
									<span class="input-group-text">Height</span>
								</div>
								<input type="number" id="pkqt_h" class="form-control disable_a_href">
							</div>
						</div>
						<div class="row">
							<div class="col-6">
								<fieldset style="width:100%;margin-left:10%">
									<legend style="white-space: nowrap;">Box ID Clearance</legend>
									<div class="mb-3" >
										<div class="input-group input-group-sm mb-3">
											<div class="input-group-prepend">
												<span class="input-group-text">Length:</span>
											</div>
											<input type="number" id="pkqt_box_id_clearance_l" class="form-control" value="0">
										</div>

										<div class="input-group input-group-sm mb-3">
											<div class="input-group-prepend">
												<span class="input-group-text">Width:</span>
											</div>
											<input type="number" id="pkqt_box_id_clearance_w" class="form-control" value="0">
										</div>

										<div class="input-group input-group-sm mb-3">
											<div class="input-group-prepend">
												<span class="input-group-text">Height:</span>
											</div>
											<input type="number" id="pkqt_box_id_clearance_h" class="form-control" value="0">
										</div>
									</div>
								</fieldset>
							</div>
							<div class="col-6">
								<fieldset  style="width:100%;margin-left:-10%">
									<legend style="white-space: nowrap;">Box OD Clearance</legend>
									<div class="mb-3" >
										<div class="input-group input-group-sm mb-3">
											<div class="input-group-prepend">
												<span class="input-group-text">Length:</span>
											</div>
											<input type="number" id="pkqt_box_od_clearance_l" class="form-control" value="0">
										</div>
										<div class="input-group input-group-sm mb-3">
											<div class="input-group-prepend">
												<span class="input-group-text">Width:</span>
											</div>
											<input type="number" id="pkqt_box_od_clearance_w" class="form-control" value="0">
										</div>
										<div class="input-group input-group-sm mb-3">
											<div class="input-group-prepend">
												<span class="input-group-text">Height:</span>
											</div>
											<input type="number" id="pkqt_box_od_clearance_h" class="form-control" value="0">
										</div>
									</div>
								</fieldset>
							</div>
						</div>
					</div>
					<!-- Table to display calculated values -->
					<h3 class="text-center" style="text-decoration: underline;">Box OD Dimensions</h3>
					<table class="table table-sm table-bordered">
						<thead>
						<tr class="text-center bg-warning">
							<th></th>
							<th>Length</th>
							<th>Width</th>
							<th>Height</th>
						</tr>
						</thead>
						<tbody>
						<tr>
							<td class="bg-warning">cm</td>
							<td><input type="text" id="length_cm" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="width_cm" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="height_cm" class="form-control form-control-sm" readonly></td>
						</tr>
						<tr>
							<td class="bg-warning">inch</td>
							<td><input type="text" id="length_in" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="width_in" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="height_in" class="form-control form-control-sm" readonly></td>
						</tr>
						<tr>
							<td class="bg-warning">feet</td>
							<td><input type="text" id="length_ft" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="width_ft" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="height_ft" class="form-control form-control-sm" readonly></td>
						</tr>
						</tbody>
					</table>
					<table class="table table-sm table-bordered">
						<thead>
						<tr class="text-center bg-warning">
							<th>Quantity</th>
							<th>Sq.ft</th>
							<th>Total Sq.ft</th>
						</tr>
						</thead>
						<tbody>
						<tr>
							<td><input type="number" id="quantity" class="form-control form-control-sm" ></td>
							<td><input type="text" id="sqft" class="form-control form-control-sm" readonly></td>
							<td><input type="text" id="total_sqft" class="form-control form-control-sm" readonly></td>
						</tr>

						</tbody>
					</table>



					<!-- Button to trigger calculation -->
					<div class="d-flex justify-content-end mt-3">
						<button class="btn btn-primary" onclick="pk_store_na_dimension_id()">Calculate</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
	document.addEventListener("DOMContentLoaded", function() {
        // List of input IDs
        let inputFields = [
            "pkqt_dimension_type", "pkqt_dimension_type_id", "pkqt_uom_calc",
            "pkqt_l", "pkqt_w", "pkqt_h",
            "pkqt_box_id_clearance_l", "pkqt_box_id_clearance_w", "pkqt_box_id_clearance_h",
            "pkqt_box_od_clearance_l", "pkqt_box_od_clearance_w", "pkqt_box_od_clearance_h",
            "length_cm", "width_cm", "height_cm",
            "length_in", "width_in", "height_in",
            "length_ft", "width_ft", "height_ft",
            "quantity", "sqft", "total_sqft",
        ];

        // Restore values from localStorage
        inputFields.forEach(id => {
            let savedValue = localStorage.getItem(id);
            if (savedValue !== null) {
                document.getElementById(id).value = savedValue;
            }
        });

        // Save values on input change
        inputFields.forEach(id => {
            document.getElementById(id).addEventListener("input", function() {
                localStorage.setItem(id, this.value);
            });
        });
    });
</script>

<script>
	function calculateDimensions(na_uom_id_val, l, w, h) {
    var dimension_type = parseInt(document.getElementById("pkqt_dimension_type_id").value);
    var UOM = parseInt(na_uom_id_val);

    var box_id_clearance_l = parseFloat(document.getElementById("pkqt_box_id_clearance_l").value) || 0;
    var box_id_clearance_w = parseFloat(document.getElementById("pkqt_box_id_clearance_w").value) || 0;
    var box_id_clearance_h = parseFloat(document.getElementById("pkqt_box_id_clearance_h").value) || 0;

    var box_od_clearance_l = parseFloat(document.getElementById("pkqt_box_od_clearance_l").value) || 0;
    var box_od_clearance_w = parseFloat(document.getElementById("pkqt_box_od_clearance_w").value) || 0;
    var box_od_clearance_h = parseFloat(document.getElementById("pkqt_box_od_clearance_h").value) || 0;

    var l_box_od, w_box_od, h_box_od;

    if (dimension_type === 1) {
        $('#pkqt_box_id_clearance_l, #pkqt_box_id_clearance_w, #pkqt_box_id_clearance_h, #pkqt_box_od_clearance_l, #pkqt_box_od_clearance_w, #pkqt_box_od_clearance_h').removeClass('disable_a_href');
        l_box_od = l + box_id_clearance_l + box_od_clearance_l;
        w_box_od = w + box_id_clearance_w + box_od_clearance_w;
        h_box_od = h + box_id_clearance_h + box_od_clearance_h;
    } else if (dimension_type === 2) {
        $('#pkqt_box_id_clearance_l, #pkqt_box_id_clearance_w, #pkqt_box_id_clearance_h').addClass('disable_a_href');
        document.getElementById("pkqt_box_id_clearance_l").value = 0;
        document.getElementById("pkqt_box_id_clearance_w").value = 0;
        document.getElementById("pkqt_box_id_clearance_h").value = 0;
        l_box_od = l + box_od_clearance_l;
        w_box_od = w + box_od_clearance_w;
        h_box_od = h + box_od_clearance_h;
    } else {
        $('#pkqt_box_id_clearance_l, #pkqt_box_id_clearance_w, #pkqt_box_id_clearance_h, #pkqt_box_od_clearance_l, #pkqt_box_od_clearance_w, #pkqt_box_od_clearance_h').addClass('disable_a_href');
        document.getElementById("pkqt_box_id_clearance_l").value = 0;
        document.getElementById("pkqt_box_id_clearance_w").value = 0;
        document.getElementById("pkqt_box_id_clearance_h").value = 0;
        document.getElementById("pkqt_box_od_clearance_l").value = 0;
        document.getElementById("pkqt_box_od_clearance_w").value = 0;
        document.getElementById("pkqt_box_od_clearance_h").value = 0;
        l_box_od = l;
        w_box_od = w;
        h_box_od = h;
    }

    var l_cm, w_cm, h_cm;
    var l_in, w_in, h_in;
    var l_ft, w_ft, h_ft;

    if (UOM == 1) { // feet
        l_cm = (l_box_od * 30.48).toFixed(2);
        w_cm = (w_box_od * 30.48).toFixed(2);
        h_cm = (h_box_od * 30.48).toFixed(2);

        l_in = (l_box_od * 12).toFixed(2);
        w_in = (w_box_od * 12).toFixed(2);
        h_in = (h_box_od * 12).toFixed(2);

        l_ft = l_box_od.toFixed(2);
        w_ft = w_box_od.toFixed(2);
        h_ft = h_box_od.toFixed(2);
    } else if (UOM == 2) { // inches
        l_cm = (l_box_od * 2.54).toFixed(2);
        w_cm = (w_box_od * 2.54).toFixed(2);
        h_cm = (h_box_od * 2.54).toFixed(2);

        l_in = l_box_od.toFixed(2);
        w_in = w_box_od.toFixed(2);
        h_in = h_box_od.toFixed(2);

        l_ft = (l_box_od / 12).toFixed(2);
        w_ft = (w_box_od / 12).toFixed(2);
        h_ft = (h_box_od / 12).toFixed(2);
    } else if (UOM == 3) { // centimeters
        l_cm = l_box_od.toFixed(2);
        w_cm = w_box_od.toFixed(2);
        h_cm = h_box_od.toFixed(2);

        l_in = (l_box_od / 2.54).toFixed(2);
        w_in = (w_box_od / 2.54).toFixed(2);
        h_in = (h_box_od / 2.54).toFixed(2);

        l_ft = (l_box_od / 30.48).toFixed(2);
        w_ft = (w_box_od / 30.48).toFixed(2);
        h_ft = (h_box_od / 30.48).toFixed(2);
    }

    // Assign to fields
    document.getElementById("length_cm").value = l_cm;
    document.getElementById("width_cm").value = w_cm;
    document.getElementById("height_cm").value = h_cm;

    document.getElementById("length_in").value = l_in;
    document.getElementById("width_in").value = w_in;
    document.getElementById("height_in").value = h_in;

    document.getElementById("length_ft").value = l_ft;
    document.getElementById("width_ft").value = w_ft;
    document.getElementById("height_ft").value = h_ft;

    // Optional: Auto-fill quantity and sqft
    let qty = document.getElementById("quantity");
    if (qty && qty.value == "") qty.value = 1;

    let sqft = document.getElementById("sqft");
    let total_sqft = document.getElementById("total_sqft");
    let calc_sqft = ((l_ft * w_ft) || 0).toFixed(2);
    let calc_total = (calc_sqft * (qty.value || 1)).toFixed(2);

    if (sqft) sqft.value = calc_sqft;
    if (total_sqft) total_sqft.value = calc_total;
}

</script>

{% endblock content%}
