{% extends "asset_mgt_app/base_modern.html" %}


{% block content %}

<div class="container-fluid py-4 bvm-modern-layout">
    <div class="modern-list-header mb-4" style="display: block !important; overflow: hidden;">
        <div class="row align-items-center">
            <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-list mr-2"></i> Bay List
                </h3>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
                <a href="{% url 'home_page' %}" class="btn btn-light shadow-sm mr-2" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.4rem 1.2rem; font-weight:600; text-transform:uppercase; color: #333 !important;">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </a>
                <a href="{% url 'bay_insert' %}" class="btn shadow-sm" style="background-color: #f5a623; color: #fff; border-radius:10px; display:inline-flex; align-items:center; padding:0.4rem 1.2rem; font-weight:600; text-transform:uppercase;">
                    <i class="fas fa-plus mr-2"></i> Add
                </a>
            </div>
        </div>
    </div>

    <div class="modern-card p-3">
        <table  id="bay_list" class="table table-hover modern-table">
        <thead class="modern-thead">
        <tr>
            <!--            <th>Product Category</th>-->
            <th>Branch</th>
            <th>Unit</th>
            <th>Bay</th>
            <th>Edit</th>
            <th>Delete</th>
        </thead>
        <tbody>
        {% for bayinfo in bay_list %}
        <tr>
            <td> {{bayinfo.bay_branch_name}}</td>
            <td> {{bayinfo.Bay_unit_name}}</td>
            <td> {{bayinfo.bay_bayname}}</td>
            <td>

                <a href="{% url 'bay_update' bayinfo.id %}" class="btn btn-warning text-white" style="background-color: #f5a623; border: none; border-radius: 20px; padding: 4px 20px;">
                    <i class="far fa-edit"></i>
                </a>
            </td>
            <td>
                <form action="{% url 'bay_delete' bayinfo.id %}" method="post" onclick="return confirm('Are you sure?');">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger" style="border-radius: 20px; padding: 4px 20px;">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
<script>
    $(document).ready(function() {
    $('#bay_list').DataTable();
} );
</script>

</div>
{% endblock content %}
