{% extends "asset_mgt_app/base.html" %}
{% load static %}
{% block content %}

<!-- Required styles -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
  .custom-div-icon i {
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }
  .select2-container {
    width: 100% !important;
  }
</style>

<div class="container-fluid p-3">
  <div class="card shadow">
    <div class="card-header bg-info text-white text-center">
      <h4>Vehicle Position Tracker</h4>
    </div>

    <div class="text-end my-3 px-4">
      <button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#filterModal">
        <i class="fas fa-filter"></i> Filter
      </button>
    </div>

    <div class="card-body px-4">
      <div id="map" style="height: 600px; width: 100%; border-radius: 10px; border: 2px solid #17a2b8;"></div>
    </div>

    <div class="container-fluid p-3">
      <div class="row">
        <div class="col-5"></div>
        <div class="col-2 rounded text-center bg-info">
          <h5 class="text-white">Vehicle List</h5>
        </div>
        <div class="col-5"></div>
      </div>
    </div>

    <div class="table-responsive px-4 pb-4">
      <table id="vehicle_gps_list" class="table table-striped table-bordered">
        <thead class="thead-dark">
          <tr>
            <th>Status</th>
            <th>Number</th>
            <th>Running</th>
            <th>Speed</th>
            <th>Last Updated</th>
          </tr>
        </thead>
        <tbody id="vehicle-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Filter Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title" id="filterModalLabel"><i class="fas fa-filter"></i> Filter Vehicles</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="modalStatusFilter" class="form-label">Trip Status</label>
            <select id="modalStatusFilter" class="form-select">
              <option value="all" selected>All</option>
              <option value="in_trip">In Trip</option>
              <option value="available">Available</option>
              <option value="workshop">Workshop</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="modalVehicleFilter" class="form-label">Vehicle Number</label>
            <select id="modalVehicleFilter" class="form-select">
              <option value="all" selected>All</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-info" id="applyFilterBtn">Apply Filter</button>
      </div>
    </div>
  </div>
</div>

<!-- Script block -->
<script>
  const vehicleToHighlight = "{{ vehicle_number|default:'' }}".toUpperCase().replace(/[\s\-]/g, '');
  const map = L.map("map").setView([12.9716, 77.5946], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors',
  }).addTo(map);

  const runningIcons = {
    Moving: L.divIcon({ className: 'custom-div-icon', html: '<i class="fa-solid fa-truck" style="color: green; font-size: 28px;"></i>', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32] }),
    Idle: L.divIcon({ className: 'custom-div-icon', html: '<i class="fa-solid fa-truck" style="color: orange; font-size: 28px;"></i>', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32] }),
    Stopped: L.divIcon({ className: 'custom-div-icon', html: '<i class="fa-solid fa-truck" style="color: red; font-size: 28px;"></i>', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32] }),
  };

  function normalize(num) {
    return num ? num.toUpperCase().replace(/[\s\-]/g, '') : '';
  }

  function loadVehicleData(statusFilter = "all", numberFilter = "all") {
    fetch("/SMS/get_vehicle_data/")
      .then(res => res.json())
      .then(data => {
        const allData = data;

        // Populate vehicle dropdown only once
        const vehicleDropdown = document.getElementById("modalVehicleFilter");
        if (vehicleDropdown && vehicleDropdown.options.length <= 1) {
          const unique = [...new Set(allData.map(v => v.number))].sort();
          unique.forEach(num => {
            const opt = document.createElement("option");
            opt.value = normalize(num);
            opt.textContent = num;
            vehicleDropdown.appendChild(opt);
          });
          $('#modalVehicleFilter').select2({ width: '100%', dropdownParent: $('#filterModal') });
        }

        let filtered;
        if (vehicleToHighlight) {
          // Live Track Filter
          filtered = allData.filter(v => normalize(v.number) === vehicleToHighlight);
        } else {
          // Normal Filter
          filtered = allData.filter(v => {
            const matchStatus = statusFilter === "all" || v.status === statusFilter;
            const matchNumber = numberFilter === "all" || normalize(v.number) === normalize(numberFilter);
            return matchStatus && matchNumber;
          });
        }

        // Clear map markers
        map.eachLayer(layer => {
          if (layer instanceof L.Marker) map.removeLayer(layer);
        });

        const markersMap = {};
        filtered.forEach(vehicle => {
          const lat = parseFloat(vehicle.lat);
          const lon = parseFloat(vehicle.lon);
          const icon = runningIcons[vehicle.running_status] || runningIcons.Stopped;

          if (!isNaN(lat) && !isNaN(lon)) {
            const marker = L.marker([lat, lon], { icon: icon })
              .addTo(map)
              .bindPopup(`
                <b>${vehicle.number}</b><br>
                Status: ${vehicle.status.replace("_", " ").toUpperCase()}<br>
                Running: ${vehicle.running_status}<br>
                Speed: ${vehicle.speed} km/h<br>
                ${vehicle.timestamp}
              `);
            markersMap[normalize(vehicle.number)] = marker;
          }
        });

        // Focus on live vehicle
        if (vehicleToHighlight && markersMap[vehicleToHighlight]) {
          map.setView(markersMap[vehicleToHighlight].getLatLng(), 15);
          markersMap[vehicleToHighlight].openPopup();
        }

        renderVehicleTable(filtered);
      })
      .catch(err => console.error("Error loading vehicle data:", err));
  }

  function renderVehicleTable(data) {
    const tbody = document.getElementById("vehicle-table-body");
    tbody.innerHTML = "";
    data.forEach(v => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="badge bg-${v.status === 'in_trip' ? 'primary' : v.status === 'available' ? 'success' : 'danger'}">${v.status.replace("_", " ").toUpperCase()}</span></td>
        <td>${v.number}</td>
        <td>${v.running_status}</td>
        <td>${v.speed} km/h</td>
        <td>${v.timestamp}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    const isLiveTrack = vehicleToHighlight !== "";

    document.getElementById("applyFilterBtn").addEventListener("click", () => {
      const status = document.getElementById("modalStatusFilter").value;
      const vehicle = document.getElementById("modalVehicleFilter").value;
      loadVehicleData(status, vehicle);

      // Hide modal and scroll
      const modal = bootstrap.Modal.getInstance(document.getElementById('filterModal'));
      modal.hide();
      setTimeout(() => {
        document.getElementById("map").scrollIntoView({ behavior: "smooth" });
      }, 300);
    });

    if (isLiveTrack) {
      // Disable modal filters
      document.getElementById("modalStatusFilter").disabled = true;
      document.getElementById("modalVehicleFilter").disabled = true;
      document.getElementById("applyFilterBtn").disabled = true;

      // Load live vehicle
      loadVehicleData();

      // Optional: Refresh every 3s
      setInterval(() => {
        loadVehicleData();
      }, 3000);
    } else {
      // Regular filter mode
      loadVehicleData();

      // Auto-refresh
      setInterval(() => {
        const status = document.getElementById("modalStatusFilter").value;
        const vehicle = document.getElementById("modalVehicleFilter").value;
        loadVehicleData(status, vehicle);
      }, 3000);
    }
  });
</script>

{% endblock %}
