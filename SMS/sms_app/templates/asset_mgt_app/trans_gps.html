{% extends "asset_mgt_app/base.html" %}
{% load static %}
{% block content %}

<!-- Required styles -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js" type="module"></script>

<style>body {
  background: #121212;
  color: #f1f1f1;
}

.card {
  background: #1e1e1e;
  color: #f1f1f1;
  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}

.card-header {
  background: linear-gradient(45deg, #0d7377, #14ffec);
  color: #fff;
  border-bottom: none;
}

.table thead {
  background: #0d7377;
  color: #fff;
}

button.btn {
  border-radius: 30px;
  font-weight: 500;
  transition: all 0.3s;
}

button.btn:hover {
  transform: scale(1.05);
}

#map {
  border: 2px solid #0d7377;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
}

/* Dark Modal */
.modal-content {
  background: #1e1e1e;
  color: #f1f1f1;
}

/* Dark Loader Centered */
#fullScreenLoader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(18, 18, 18, 0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  flex-direction: column;
  transition: opacity 0.3s ease;
}

#fullScreenLoader p {
  margin-top: 20px;
  font-size: 20px;
  color: #FF0000;
  font-weight: bold;
}
</style>

<div class="container-fluid p-3 position-relative">
  <div class="card shadow">
    <div class="card-header bg-info text-white text-center">
      <h4>Vehicle Position Tracker</h4>
    </div>




<div class="d-flex justify-content-between align-items-center my-3 px-4">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#simTrackingModal" onclick="loadSimTrackingData()">
    <i class="fas fa-satellite-dish"></i> SIM Tracking
  </button>
  <button class="btn btn-info" data-bs-toggle="modal" data-bs-target="#filterModal">
    <i class="fas fa-filter"></i> Filter
  </button>
</div>


<!-- SIM Tracking Modal -->
<div class="modal fade" id="simTrackingModal" tabindex="-1" aria-labelledby="simTrackingModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title" id="simTrackingModalLabel"><i class="fas fa-truck"></i> SIM Tracking Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table table-bordered table-hover text-center">
          <thead class="table-dark">
            <tr>
              <th>Vehicle Number</th>
              <th>Driver Name</th>
              <th>Mobile Number</th>
              <th>Status</th>
              <th>Track</th>
            </tr>
          </thead>
          <tbody id="sim-tracking-body">
            <tr><td colspan="5" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

    <div class="card-body px-4 position-relative">
      <div id="map" style="height: 600px; width: 100%; border-radius: 10px; border: 2px solid #17a2b8;"></div>
    </div>

    <div class="container-fluid p-3">
      <div class="row">
        <div class="col-5"></div>
        <div class="col-2 rounded text-center bg-info">
          <h5 class="text-white">Vehicle List</h5>
        </div>
        <div class="col-5"></div>
      </div>
    </div>

    <div class="table-responsive px-4 pb-4">
      <table id="vehicle_gps_list" class="table table-striped table-bordered">
        <thead class="thead-dark">
          <tr>
            <th>Status</th>
            <th>Number</th>
            <th>Running</th>
            <th>Speed</th>
            <th>Odometer</th>
            <th>Last Updated</th>
          </tr>
        </thead>
        <tbody id="vehicle-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Filter Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title" id="filterModalLabel"><i class="fas fa-filter"></i> Filter Vehicles</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="modalStatusFilter" class="form-label">Trip Status</label>
            <select id="modalStatusFilter" class="form-select">
              <option value="all" selected>All</option>
              <option value="in_trip">In Trip</option>
              <option value="available">Available</option>
              <option value="workshop">Workshop</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="modalVehicleFilter" class="form-label">Vehicle Number</label>
            <select id="modalVehicleFilter" class="form-select">
              <option value="all" selected>All</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-info" id="applyFilterBtn">Apply Filter</button>
      </div>
    </div>
  </div>
</div>

<script>
  let allVehicleData = [];
let currentStatusFilter = "all";
let currentVehicleFilter = "all";
let liveTrackMode = false;
const liveTrackVehicleNumber = "{{ vehicle_number|default:'' }}".toUpperCase().replace(/[\s\-]/g, '');

function normalize(num) {
  return num ? num.toUpperCase().replace(/[\s\-]/g, '') : '';
}

const map = L.map("map").setView([12.9716, 77.5946], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors',
}).addTo(map);

const runningIcons = {
  Moving: L.divIcon({ html: '<i class="fa-solid fa-truck" style="color: green; font-size: 28px;"></i>', iconSize: [32, 32], iconAnchor: [16, 32] }),
  Idle: L.divIcon({ html: '<i class="fa-solid fa-truck" style="color: orange; font-size: 28px;"></i>', iconSize: [32, 32], iconAnchor: [16, 32] }),
  Stopped: L.divIcon({ html: '<i class="fa-solid fa-truck" style="color: red; font-size: 28px;"></i>', iconSize: [32, 32], iconAnchor: [16, 32] }),
};

function showLoader() {
  if (!document.getElementById("fullScreenLoader")) {
    const loader = document.createElement("div");
    loader.id = "fullScreenLoader";
    loader.innerHTML = `
      <dotlottie-wc src="https://lottie.host/7dfc6f49-e000-4eca-b3bb-c6097b76f6a4/Ek7CbZuhdh.lottie"
        style="width: 300px; height: 300px;" autoplay loop></dotlottie-wc>
      <p>Loading Vehicle Data...</p>`;
    document.body.appendChild(loader);
  }
}

function hideLoader() {
  const loader = document.getElementById("fullScreenLoader");
  if (loader) loader.remove();
}

function populateVehicleDropdown() {
  const vehicleDropdown = document.getElementById("modalVehicleFilter");
  vehicleDropdown.innerHTML = '<option value="all">All</option>';

  let filteredList = allVehicleData;
  if (currentStatusFilter !== "all") {
    filteredList = filteredList.filter(v => v.status === currentStatusFilter);
  }

  const uniqueNumbers = [...new Set(filteredList.map(v => v.number))].sort();
  uniqueNumbers.forEach(num => {
    const opt = document.createElement("option");
    opt.value = normalize(num);
    opt.textContent = num;
    vehicleDropdown.appendChild(opt);
  });

  if (typeof $ !== 'undefined' && $.fn.select2) {
    $(vehicleDropdown).select2({ width: '100%' });
  }
}

function applyFiltersAndRender() {
  let filtered = allVehicleData;

  if (currentStatusFilter !== "all") {
    filtered = filtered.filter(v => v.status === currentStatusFilter);
  }
  if (currentVehicleFilter !== "all") {
    filtered = filtered.filter(v => normalize(v.number) === currentVehicleFilter);
  }

  renderMarkers(filtered);
  renderVehicleTable(filtered);
}

function renderMarkers(vehicleList) {
  map.eachLayer(layer => {
    if (layer instanceof L.Marker) map.removeLayer(layer);
  });

  vehicleList.forEach(v => {
    const lat = parseFloat(v.lat);
    const lon = parseFloat(v.lon);
    const icon = runningIcons[v.running_status] || runningIcons.Stopped;

    if (!isNaN(lat) && !isNaN(lon)) {
      const marker = L.marker([lat, lon], { icon: icon })
        .addTo(map)
        .bindPopup(`<b>${v.number}</b><br>Status: ${v.status.toUpperCase()}<br>Running: ${v.running_status}<br>Speed: ${v.speed} km/h<br>Odometer: ${v.Odometer} km<br>${v.timestamp}`);
      if (liveTrackMode) {
        map.setView([lat, lon], 15);
        marker.openPopup();
      }
    }
  });
}

function renderVehicleTable(vehicleList) {
  const tbody = document.getElementById("vehicle-table-body");
  tbody.innerHTML = "";

  vehicleList.forEach(v => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="badge bg-${v.status === 'in_trip' ? 'primary' : v.status === 'available' ? 'success' : 'danger'}">${v.status.replace("_", " ").toUpperCase()}</span></td>
      <td>${v.number}</td>
      <td>${v.running_status}</td>
      <td>${v.speed} km/h</td>
      <td>${v.Odometer} km</td>
      <td>${v.timestamp}</td>`;
    tbody.appendChild(tr);
  });
}

function loadVehicleData(showSpinner = false) {
  if (showSpinner) showLoader();

  fetch("/SMS/get_vehicle_data/")
    .then(res => res.json())
    .then(data => {
      allVehicleData = data.all_data || [];

      if (liveTrackMode) {
        const liveData = allVehicleData.filter(v => normalize(v.number) === liveTrackVehicleNumber);
        renderMarkers(liveData);
        renderVehicleTable(liveData);
      } else {
        populateVehicleDropdown();
        applyFiltersAndRender();
      }

      if (showSpinner) hideLoader();
    })
    .catch(err => {
      console.error("Error loading vehicle data:", err);
      if (showSpinner) hideLoader();
    });
}

// --- INIT ON PAGE LOAD ---
document.addEventListener("DOMContentLoaded", () => {
  liveTrackMode = liveTrackVehicleNumber !== "";

  if (!liveTrackMode) populateVehicleDropdown();

  loadVehicleData(true);
  setInterval(() => loadVehicleData(), 5000);

  document.getElementById("modalStatusFilter").addEventListener("change", function () {
    currentStatusFilter = this.value;
    if (!liveTrackMode) {
      populateVehicleDropdown();
    }
  });

  document.getElementById("modalVehicleFilter").addEventListener("change", function () {
    currentVehicleFilter = this.value;
  });

  document.getElementById("applyFilterBtn").addEventListener("click", () => {
    if (!liveTrackMode) {
      applyFiltersAndRender();
    }
    bootstrap.Modal.getInstance(document.getElementById("filterModal")).hide();
  });

  // Optional: Button to Exit Live Track Mode (show all vehicles again)
  if (liveTrackMode) {
    const resetBtn = document.createElement("button");
    resetBtn.textContent = "Show All Vehicles";
    resetBtn.className = "btn btn-warning my-2";
    resetBtn.onclick = () => window.location.href = window.location.pathname;
    document.querySelector(".d-flex.justify-content-between").appendChild(resetBtn);
  }
});

</script>
<script>
  function loadSimTrackingData() {
    const tbody = document.getElementById('sim-tracking-body');
    tbody.innerHTML = `<tr><td colspan="5" class="text-muted">Loading...</td></tr>`;

    fetch("{% url 'get_sim_tracking_data' %}")
      .then(response => response.json())
      .then(data => {
        tbody.innerHTML = "";
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-muted">No Data Available</td></tr>`;
        } else {
          data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${item.imei || 'NA'}</td>
              <td>${item.driver_name || 'NA'}</td>
              <td>${item.sim_number || 'NA'}</td>
              <td>${item.status || 'NA'}</td>
              <td>
                <a href="${item.track_url}" target="_blank" class="btn btn-sm btn-info ${item.status === 1 ? '' : 'disabled'}">
                  <i class="fas fa-map-marker-alt"></i> Track
                </a>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      })
      .catch(() => {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger">Error loading data</td></tr>`;
      });
  }
</script>

{% endblock %}
