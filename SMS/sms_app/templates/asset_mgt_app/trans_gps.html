{% extends "asset_mgt_app/base.html" %}
{% load static %}
{% block content %}

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<div class="container-fluid p-3">
    <div class="card shadow">
        <div class="card-header bg-info text-white text-center">
            <h4>Vehicle Position Tracker</h4>
        </div>
        <div class="row mt-3 mb-3 justify-content-center">
            <div class="col-md-3">
                <label for="statusFilter" class="form-label fw-bold">Status:</label>
                <select id="statusFilter" class="form-select">
                    <option value="all" selected>All</option>
                    <option value="in_trip">In Trip</option>
                    <option value="available">Available</option>
                    <option value="workshop">Workshop</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="vehicleNumberFilter" class="form-label fw-bold">Vehicle Number:</label>
                <select id="vehicleNumberFilter" class="select2">
                    <option value="all" selected>All</option>
                </select>
            </div>
        </div>

        <div class="card-body p-4">
            <div id="map" style="height: 600px; width: 100%;"></div>
        </div>

        <div class="container-fluid" style="padding:15px;">
            <div class="row">
                <div class="col-5"></div>
                <div class="col-2 rounded text-center bg-info">
                    <h3>Vehicle List</h3>
                </div>
                <div class="col-5"></div>
            </div>
        </div>
        <table id="vehicle_gps_list" class="table table-striped table-bordered">
            <thead class="thead-dark">
            <tr>
                <th>Status</th>
                <th>Number</th>
                <th>Running</th>
                <th>Speed</th>
                <th>Last Updated</th>
            </tr>
            </thead>
            <tbody id="vehicle-table-body">
            <!-- Filled dynamically by DataTables API -->
            </tbody>
        </table>
    </div>
</div>

<style>
    .custom-div-icon i {
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }
    .select2-container {
      width: 100% !important;
    }
</style>

<script>
    const map = L.map("map").setView([12.9716, 77.5946], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors',
    }).addTo(map);

    const runningIcons = {
      Moving: L.divIcon({
        className: 'custom-div-icon',
        html: '<i class="fa-solid fa-truck" style="color: green; font-size: 28px;"></i>',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32],
      }),
      Idle: L.divIcon({
        className: 'custom-div-icon',
        html: '<i class="fa-solid fa-truck" style="color: orange; font-size: 28px;"></i>',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32],
      }),
      Stopped: L.divIcon({
        className: 'custom-div-icon',
        html: '<i class="fa-solid fa-truck" style="color: red; font-size: 28px;"></i>',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32],
      }),
    };

    let lastVehicleData = [];
    let dataTable;

    function populateVehicleNumberDropdown(vehicleData, statusFilter = "all") {
      const vehicleNumberSelect = document.getElementById("vehicleNumberFilter");
      const selectedValue = vehicleNumberSelect.value || "all";

      vehicleNumberSelect.innerHTML = '<option value="all" selected>All</option>';
      const filtered = statusFilter === "all" ? vehicleData : vehicleData.filter(v => v.status === statusFilter);
      const numbers = [...new Set(filtered.map(v => v.number))].sort();

      numbers.forEach(num => {
        const opt = document.createElement("option");
        opt.value = num;
        opt.textContent = num;
        vehicleNumberSelect.appendChild(opt);
      });

      if (numbers.includes(selectedValue)) {
        vehicleNumberSelect.value = selectedValue;
      }
    }

    function loadVehicleData(statusFilter = "all", vehicleNumberFilter = "all") {
      fetch("/SMS/get_vehicle_data/")
        .then(res => res.json())
        .then(data => {
          lastVehicleData = data;
          populateVehicleNumberDropdown(data, statusFilter);

          // Clear map markers
          map.eachLayer(layer => {
            if (layer instanceof L.Marker) map.removeLayer(layer);
          });

          // Filter data based on filters
          const filteredData = data.filter(vehicle => {
            if (statusFilter !== "all" && vehicle.status !== statusFilter) return false;
            if (vehicleNumberFilter !== "all" && vehicle.number !== vehicleNumberFilter) return false;
            return true;
          });

          // Initialize DataTable if not initialized
          if (!dataTable) {
            dataTable = $('#vehicle_gps_list').DataTable({
              order: [[0, 'asc']],
              dom: 'Bfrtip',
              buttons: ['copy', 'csv', 'excel', 'print'],
              data: filteredData,
              columns: [
                {
                  data: 'status',
                  render: function(data, type, row) {
                    return data.replace("_", " ").toUpperCase();
                  }
                },
                { data: 'number' },
                { data: 'running_status' },
                {
                  data: 'speed',
                  render: function(data, type, row) {
                    return data + " km/h";
                  }
                },
                { data: 'timestamp' }
              ],
              destroy: true // allow reinitialization
            });
          } else {
            // Clear and add new data
            dataTable.clear();
            dataTable.rows.add(filteredData);
            dataTable.draw();
          }

          // Add markers on map
          filteredData.forEach(vehicle => {
            const lat = parseFloat(vehicle.lat);
            const lon = parseFloat(vehicle.lon);
            const icon = runningIcons[vehicle.running_status] || runningIcons.Stopped;

            if (!isNaN(lat) && !isNaN(lon)) {
              L.marker([lat, lon], { icon: icon })
                .addTo(map)
                .bindPopup(`
                  <b>${vehicle.number}</b><br>
                  Status: ${vehicle.status.replace("_", " ").toUpperCase()}<br>
                  Running: ${vehicle.running_status}<br>
                  Speed: ${vehicle.speed} km/h<br>
                  ${vehicle.timestamp}
                `);
            }
          });
        })
        .catch(err => console.error("Error loading vehicle data:", err));
    }

    // Initial load
    loadVehicleData();

    // Refresh every 10 seconds
    setInterval(() => {
      const status = document.getElementById("statusFilter").value;
      const number = document.getElementById("vehicleNumberFilter").value;
      loadVehicleData(status, number);
    }, 10000);

    // Filter event handlers
    document.getElementById("statusFilter").addEventListener("change", function () {
      loadVehicleData(this.value, "all");
    });

    document.getElementById("vehicleNumberFilter").addEventListener("change", function () {
      const status = document.getElementById("statusFilter").value;
      loadVehicleData(status, this.value);
    });
</script>

<script>
    $(document).ready(function () {
        $('#vehicleNumberFilter').select2({
            width: 'resolve',
            placeholder: "Select Vehicle Number",
            allowClear: true
        });
    });
</script>

{% endblock %}
