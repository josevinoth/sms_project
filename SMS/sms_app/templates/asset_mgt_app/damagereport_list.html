{% extends "asset_mgt_app/base_modern.html" %}

{% block content %}
<div class="container-fluid py-4 bvm-modern-layout">
    <div class="modern-list-header mb-4" style="display: block !important; overflow: hidden;">
        <div class="row align-items-center">
            <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-list mr-2"></i> Damage Report List
                </h3>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
                <a href="{% url 'home_page' %}" class="btn btn-light shadow-sm mr-2" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.4rem 1.2rem; font-weight:600; text-transform:uppercase; color: #333 !important;">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </a>
                <a href="{% url 'damagereport_insert' %}" class="btn shadow-sm" style="background-color: #f5a623; color: #fff; border-radius:10px; display:inline-flex; align-items:center; padding:0.4rem 1.2rem; font-weight:600; text-transform:uppercase;">
                    <i class="fas fa-plus mr-2"></i> Add
                </a>
            </div>
        </div>
    </div>
    
    <div class="modern-card p-3">
        <table id="damagereport_list" class="table table-hover modern-table" style="width:100%">
            <thead class="modern-thead">
                <tr>
                    <th>WH Job Number</th>
                    <th>Damage Type</th>
                    <th>GRN Number</th>
                    <th>Damage Report</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#damagereport_list').DataTable({
        "serverSide": true,
        "processing": true,
        "ajax": {
            "url": "{% url 'damagereport_list_ajax' %}",
            "type": "GET"
        },
        "columns": [
            { "data": "dam_wh_job_num" },
            { "data": "dam_damage_type" },
            { "data": "dam_GRN_num" },
            { "data": "report", "orderable": false, "searchable": false },
            { "data": "edit", "orderable": false, "searchable": false },
            { "data": "delete", "orderable": false, "searchable": false }
        ],
        "drawCallback": function () {
            $('.dataTables_paginate > .pagination').addClass('pagination-modern');
        }
    });
});
</script>

{% endblock content %}
