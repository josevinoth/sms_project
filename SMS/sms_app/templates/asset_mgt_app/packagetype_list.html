{% extends "asset_mgt_app/base_modern.html" %}
{% block content %}
<div class="container-fluid py-4 bvm-modern-layout">
    <div class="modern-list-header mb-4" style="display: block !important; overflow: hidden;">
        <div class="row align-items-center">
            <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-box-open mr-2"></i> Package Type List
                </h3>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
                <a href="{% url 'packagetype_insert' %}" class="btn mr-2" style="background: linear-gradient(135deg, #fbbf24, #f59e0b) !important; color: white !important; border-radius:10px; display:inline-flex; align-items:center; padding:0.5rem 1.2rem; font-weight:600; text-transform:uppercase;">
                    <i class="fas fa-plus mr-2"></i> Add New
                </a>
                <a href="{% url 'home_page' %}" class="btn btn-cancel" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.5rem 1.2rem; font-weight:600; text-transform:uppercase;">
                    <i class="fas fa-arrow-left mr-1"></i> Back
                </a>
            </div>
        </div>
    </div>
    <div class="modern-card p-4" style="background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <div class="table-responsive">
            <table id="packagetype_list" class="table table-hover modern-table w-100">
                <thead class="modern-thead">
                <tr>
                    <th>Type</th>
                    <th class="text-center" style="width: 80px;">Edit</th>
                    <th class="text-center" style="width: 80px;">Delete</th>
                </tr>
                </thead>
                <tbody>
                {% for info in packagetype_list %}
                <tr>
                    <td class="align-middle font-weight-bold">{{info.package_type}}</td>
                    <td class="text-center align-middle">
                        <a href="{% url 'packagetype_update' info.id %}" class="btn btn-sm btn-outline-primary" style="border-radius: 6px;">
                            <i class="far fa-edit"></i>
                        </a>
                    </td>
                    <td class="text-center align-middle">
                        <form action="{% url 'packagetype_delete' info.id %}" method="post" onsubmit="return confirm('Are you sure you want to delete this item?');" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-outline-danger" style="border-radius: 6px;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>
$(document).ready(function() {
    $('#packagetype_list').DataTable({
        responsive: true, scrollX: true, autoWidth: false,
        dom: '<"row"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>><"row"<"col-sm-12"tr>><"row"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
        drawCallback: function () { $('.dataTables_paginate > .pagination').addClass('pagination-modern'); }
    });
});
</script>
{% endblock content %}
