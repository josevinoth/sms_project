{% extends "asset_mgt_app/base_modern.html" %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<div class="modern-list-header">
    <div class="modern-list-title">
        <i class="fas fa-hand-holding-usd"></i>
        <h2>Drivers Advance Report</h2>
    </div>
    <div class="modern-list-actions">
        <a href="{% url 'transport_reports' %}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left mr-1"></i> Back to Reports
        </a>
    </div>
</div>

<!-- Modern Filter Form -->
<div class="form-section">
    <form method="POST" action="{% url 'drivers_advance_report' %}" class="row g-3 align-items-end" id="filterForm">
        {% csrf_token %}

        <div class="col-md-3 mb-2">
            <label class="form-label font-weight-bold">Driver Name</label>
            <select name="driver_name" id="driver_name" class="form-control form-control-modern select2">
                <option value="">-- Select Driver --</option>
                {% for driver in drivers %}
                <option value="{{ driver.id }}" {% if driver.id == selected_driver_id %}selected{% endif %}>
                    {{ driver.dm_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3 mb-2">
            <label class="form-label font-weight-bold">From Date</label>
            <input type="date" name="from_date" class="form-control form-control-modern" value="{{ from_date }}">
        </div>

        <div class="col-md-3 mb-2">
            <label class="form-label font-weight-bold">To Date</label>
            <input type="date" name="to_date" class="form-control form-control-modern" value="{{ to_date }}">
        </div>

        <div class="col-md-3 mb-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-block mr-1">
                <i class="fas fa-filter mr-1"></i> Filter
            </button>
            <a href="{% url 'drivers_advance_report' %}" class="btn btn-outline-secondary">
                <i class="fas fa-undo"></i>
            </a>
        </div>
    </form>
</div>

<!-- Modern Table Card -->
<div class="modern-card">
    <div class="table-responsive">
        <table id="drivers_advance_table" class="table modern-table table-hover" style="width:100%">
            <thead>
                <tr>
                    {% for header in headers %}
                    <th>{{ header }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for row in data_rows %}
                <tr>
                    {% for cell in row %}
                    <td>{{ cell }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
$(document).ready(function () {
    $('.select2').select2({
        placeholder: "Type driver name...",
        allowClear: true,
        width: '100%'
    });

    const table = $('#drivers_advance_table').DataTable({
        scrollX: true,
        scrollY: "58vh",
        scrollCollapse: true,
        autoWidth: false,
        dom: "<'row mb-2'<'col-sm-12 col-md-6 d-flex align-items-center'lB><'col-sm-12 col-md-6 d-flex justify-content-end'f>>" +
             "<'row'<'col-sm-12'tr>>" +
             "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7 d-flex justify-content-end'p>>",
        lengthMenu: [
            [10, 25, 50, 100, -1],
            [10, 25, 50, 100, "All"]
        ],
        pageLength: 25,
        buttons: [
            { extend: 'copy', className: 'btn btn-outline-secondary btn-sm mr-1' },
            { extend: 'csv', className: 'btn btn-outline-secondary btn-sm mr-1' },
            { extend: 'excelHtml5', className: 'btn btn-outline-success btn-sm mr-1', text: 'Excel', title: 'Drivers Advance Report' },
            { extend: 'pdfHtml5', className: 'btn btn-outline-danger btn-sm mr-1', orientation: 'landscape', pageSize: 'A4', title: 'Drivers Advance Report' },
            { extend: 'print', className: 'btn btn-outline-dark btn-sm', title: 'Drivers Advance Report' }
        ],
        order: [[0, 'asc']]
    });

    $(window).on('resize', function () {
        table.columns.adjust();
    });
});
</script>
{% endblock %}
