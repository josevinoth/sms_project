{% extends "asset_mgt_app/base.html" %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<div class="container-fluid d-flex justify-content-center py-3">
    <div class="rounded text-center bg-info shadow-box px-4 py-2">
        <h3>Drivers Advance Report</h3>
    </div>
</div>
<br>

<form method="POST" action="{% url 'drivers_advance_report' %}"
      class="row g-3 align-items-end"
      id="filterForm">
    {% csrf_token %}

    <div class="col-md-3">
    <label class="form-label fw-bold">Driver Name</label>
    <select name="driver_name" id="driver_name" class="form-control select2">
        <option value="">-- Select Driver --</option>
        {% for driver in drivers %}
            <option value="{{ driver.id }}"
                {% if driver.id|stringformat:"s" == selected_driver_name %}
                    selected
                {% endif %}
            >
                {{ driver.dm_name }}
            </option>
        {% endfor %}
    </select>
</div>


    <div class="col-md-3">
        <label class="form-label fw-bold">From Date</label>
        <input type="date" name="from_date" class="form-control" value="{{ from_date }}">
    </div>

    <div class="col-md-3">
        <label class="form-label fw-bold">To Date</label>
        <input type="date" name="to_date" class="form-control" value="{{ to_date }}">
    </div>

    <div class="col-md-3">
        <button type="submit" class="btn btn-primary">Filter</button>
        <a href="{% url 'drivers_advance_report' %}" class="btn btn-secondary">Clear</a>
    </div>
</form>
<br>

<div class="row">
    <div class="col-auto">
        <a href="{% url 'transport_reports' %}" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>
<br>

<div class="container-fluid shadow-box-table">
    <table id="drivers_advance_table" class="table table-striped table-bordered" style="width:100%">
        <thead class="thead-dark">
            <tr>
                {% for header in headers %}
                <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data_rows %}
            <tr>
                {% for cell in row %}
                <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
$(document).ready(function () {

    $('#drivers_advance_table').DataTable({
        scrollX: true,
        dom: 'lBfrtip',

        lengthMenu: [
            [10, 25, 50, 100, -1],
            [10, 25, 50, 100, "All"]
        ],

        pageLength: 10,

        buttons: [
            'copy',
            'csv',

            // =========================
            // EXCEL EXPORT
            // =========================
            {
                extend: 'excelHtml5',
                text: 'Excel',
                title: 'Drivers Advance Report',

                customize: function (xlsx) {

                    let sheet = xlsx.xl.worksheets['sheet1.xml'];
                    let styles = xlsx.xl['styles.xml'];

                    // FONT
                    let fonts = $('fonts', styles);
                    fonts.append(`
                        <font>
                            <sz val="11"/>
                            <color rgb="FFFFFFFF"/>
                            <name val="Calibri"/>
                            <b/>
                        </font>
                    `);
                    let fontId = fonts.children().length - 1;

                    // FILL (BLUE)
                    let fills = $('fills', styles);
                    fills.append(`
                        <fill>
                            <patternFill patternType="solid">
                                <fgColor rgb="FF0A3278"/>
                                <bgColor indexed="64"/>
                            </patternFill>
                        </fill>
                    `);
                    let fillId = fills.children().length - 1;

                    // STYLE
                    let cellXfs = $('cellXfs', styles);
                    cellXfs.append(`
                        <xf xfId="0" fontId="${fontId}" fillId="${fillId}"
                            borderId="0" applyFont="1" applyFill="1"/>
                    `);
                    let styleId = cellXfs.children().length - 1;

                    // APPLY STYLE TO HEADER ROW
                    $('row:eq(1) c', sheet).attr('s', styleId);
                }
            },

            // =========================
            // PDF EXPORT
            // =========================
            {
                extend: 'pdfHtml5',
                orientation: 'landscape',
                pageSize: 'A4',
                title: 'Drivers Advance Report',

                customize: function (doc) {
                    doc.styles.tableHeader.fillColor = '#0A3278';
                    doc.styles.tableHeader.color = 'white';
                    doc.styles.tableHeader.bold = true;
                }
            },

            // =========================
            // PRINT
            // =========================
            {
                extend: 'print',
                title: 'Drivers Advance Report',

                customize: function (win) {
                    $(win.document.body).find('thead th')
                        .css('background-color', '#0A3278')
                        .css('color', 'white')
                        .css('font-weight', 'bold');
                }
            }
        ],

        order: [[0, 'asc']]
    });

});
</script>
<script>
(function waitForJquery() {
    if (window.jQuery) {
        $('#driver_name').select2({
            placeholder: "Type driver name...",
            allowClear: true,
            width: '100%',
            dropdownParent: $('#filterForm')
        });
    } else {
        setTimeout(waitForJquery, 50);
    }
})();
</script>


<style>
.select2-container {
    width: 100% !important;
}

.select2-container--default .select2-selection--single {
    height: 38px;
    padding: 4px 6px;
}

.select2-dropdown {
    z-index: 1055; /* higher than bootstrap */
}
</style>


{% endblock content %}
