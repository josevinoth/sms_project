{% extends "asset_mgt_app/base_modern.html" %}
{% block content %}
<div class="container-fluid py-4 bvm-modern-layout">
    <!-- Header -->
    <div class="modern-list-header mb-4" style="display: block !important; overflow: hidden;">
        <div class="row align-items-center">
            <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-chart-area mr-2"></i> Space Utilization Report
                </h3>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end">
                <a href="{% url 'warehouse_reports' %}" class="btn btn-light shadow-sm" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.4rem 1.2rem; font-weight:600; text-transform:uppercase; color: #333 !important;">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </a>
            </div>
        </div>
    </div>

    <!-- Filter Card -->
    <div class="modern-card p-4 shadow-sm mb-4" style="border-radius: 12px;">
        <form id="filterForm" method="GET" action="{% url 'space_utilization_reports' %}">
            <div class="row align-items-end">
                <div class="col-md-3 mb-3 mb-md-0">
                    <label for="branch-filter" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted, #94a3b8); text-transform: uppercase; margin-bottom: 0.5rem;">Branch</label>
                    <select id="branch-filter" name="branch" class="form-control" style="border-radius:8px; border:1px solid var(--border-light, #cbd5e1); background: var(--bg-input, #fff); color: var(--text-color, #333); height: 38px;">
                        <option value="">All</option>
                        {% for branch in branches %}
                        <option value="{{ branch.loc_name }}" {% if branch.loc_name == selected_branch %}selected{% endif %}>{{ branch.loc_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3 mb-md-0">
                    <label for="from-date" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted, #94a3b8); text-transform: uppercase; margin-bottom: 0.5rem;">From Date</label>
                    <input type="date" id="from-date" name="from_date" class="form-control" style="border-radius:8px; border:1px solid var(--border-light, #cbd5e1); background: var(--bg-input, #fff); color: var(--text-color, #333); height: 38px;" value="{{ from_date }}">
                </div>
                <div class="col-md-2 mb-3 mb-md-0">
                    <label for="to-date" style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted, #94a3b8); text-transform: uppercase; margin-bottom: 0.5rem;">To Date</label>
                    <input type="date" id="to-date" name="to_date" class="form-control" style="border-radius:8px; border:1px solid var(--border-light, #cbd5e1); background: var(--bg-input, #fff); color: var(--text-color, #333); height: 38px;" value="{{ to_date }}">
                </div>
                <div class="col-md-4 mb-3 mb-md-0 d-flex gap-2">
                    <button type="submit" class="btn btn-primary" style="border-radius:8px; padding:0.3rem 1.5rem; font-weight:600; font-size: 0.9rem;">
                        FILTER
                    </button>
                    <a href="{% url 'space_utilization_reports' %}" class="btn btn-secondary ml-2" style="border-radius:8px; padding:0.3rem 1.5rem; font-weight:600; font-size: 0.9rem; background-color:#6c757d;">
                        CLEAR
                    </a>
                </div>
            </div>
        </form>
    </div>

    <!-- Table Card -->
    <div class="modern-card p-4 shadow-sm" style="border-radius: 12px;">
        <div class="table-responsive">
            <table id="space_utilization_report" class="table table-hover modern-table text-center w-100 table-bordered">
        <thead class="modern-thead"> <tr>
            <th>
            <input type="text" class="form-control filter-input" placeholder="Search Branch"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Unit"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Bay"></th>
           <!-- <th><input type="text" class="form-control filter-input" placeholder="Search Customer"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Model"></th>!-->
            <th><input type="text" class="form-control filter-input" placeholder="Search Total Area"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Occupied Area"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Available Area"></th>
            <!--<th><input type="text" class="form-control filter-input" placeholder="Search Total Volume"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Occupied Volume"></th>
            <th><input type="text" class="form-control filter-input" placeholder="Search Available Volume"></th>!-->
        </tr>
        <tr>
            <th>Warehouse Branch</th>
            <th>Warehouse Unit</th>
            <th>Bay</th>
           <!-- <th>Customer Name</th>
            <th>Customer Model</th>!-->
            <th>Total Area (Sq.ft)</th>
            <th>Occupied Area (Sq.ft)</th>
            <th>Available Area (Sq.ft)</th>
           <!-- <th>Total Volume (Cu.ft)</th>
            <th>Occupied Volume (Cu.ft)</th>
            <th>Available Volume (Cu.ft)</th>!-->
        </thead>
        <tbody></tbody>
    </table>
</div>
</div>
</div>
<style>.dataTables_length select { width: 70px !important; display: inline-block; border-radius: 6px; border: 1px solid var(--border-light, #cbd5e1); background: var(--bg-input, #fff); color: var(--text-color, #333); padding: 0.2rem 0.5rem; }</style>
</div>
</div>
</div>
<script>
    $(document).ready(function() {
        var table = $('#space_utilization_report').DataTable({
            serverSide: true,
            ajax: {
                url: window.location.href,
                type: 'GET'
            },
            deferRender: true,
            scrollX: true,
            scrollCollapse: true,
            order: [[0, 'asc']],
            autoWidth: false,
            dom: '<"row align-items-center mb-3"<"col-sm-12 col-md-8 d-flex align-items-center"l B><"col-sm-12 col-md-4 text-right"f>>' +
                 '<"row"<"col-sm-12"tr>>' +
                 '<"row mt-3"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
            buttons: ['copy', 'csv', 'excel', 'print'],
            drawCallback: function () {
                $('.dataTables_paginate > .pagination').addClass('pagination-modern');
            }
        });
    });


</script>
{% endblock content %}
