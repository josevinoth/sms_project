{% extends "asset_mgt_app/base_modern.html" %}

{% block content %}
<div class="container-fluid py-4 bvm-modern-layout">
    <!-- ? Centralized Page Header ? -->
    <div class="modern-list-header mb-4" style="background: linear-gradient(135deg, #2dd4bf 0%, #3b82f6 100%); border-radius: 12px; padding: 20px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <div class="row align-items-center">
            <div class="col-12 col-md-6 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-briefcase mr-2"></i> WAREHOUSE JOBS LIST
                </h3>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-end gap-2">
                <a href="{% url 'home_page' %}" class="btn" style="background: #ffffff; color: #3b82f6; font-weight: 700; border-radius: 8px; padding: 8px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <i class="fas fa-arrow-left"></i> BACK
                </a>
                <a href="{% url 'wh_job_insert' %}" class="btn" style="background: #fbbf24; color: white; font-weight: 700; border-radius: 8px; padding: 8px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <i class="fas fa-plus"></i> ADD NEW
                </a>
            </div>
        </div>
    </div>

    <!-- ? Table Section ? -->
    <div class="table-responsive bg-white rounded-lg shadow-sm p-3" style="border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;">
        <table id="wh_job_list_table" class="table modern-table w-100 text-center">
            <thead>
                <tr>
                    <th>JOB NUMBER</th>
                    <th>SHIPPER INVOICE NUMBER</th>
                    <th>CUSTOMER NAME</th>
                    <th>EDIT</th>
                    <th>DELETE</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<style>
    .bvm-modern-layout {
        font-family: 'Inter', 'Segoe UI', sans-serif;
    }
    
    .modern-table thead th {
        background-color: #0f172a !important;
        color: #f8fafc !important;
        font-size: 0.75rem !important;
        font-weight: 800 !important;
        letter-spacing: 0.5px;
        padding: 12px 15px !important;
        border: none !important;
        white-space: nowrap;
    }
    .modern-table tbody td {
        vertical-align: middle !important;
        padding: 12px 15px !important;
        font-size: 0.85rem;
        color: #334155;
        border-bottom: 1px solid #e2e8f0;
        white-space: nowrap;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var table = $('#wh_job_list_table').DataTable({
            responsive: true,
            scrollX: true,
            dom: "<'row mb-3 align-items-center'<'col-sm-12 col-md-3'l><'col-sm-12 col-md-6 d-flex justify-content-center'B><'col-sm-12 col-md-3'f>>" + "<'row'<'col-sm-12'tr>>" + "<'row mt-3'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",
            buttons: [
                { extend: 'copy', className: 'btn btn-outline-secondary' },
                { extend: 'csv', className: 'btn btn-outline-secondary' },
                { extend: 'excel', className: 'btn btn-outline-secondary' },
                { extend: 'print', className: 'btn btn-outline-secondary' }
            ],
            serverSide: true,
            processing: true,
            ajax: {
                url: "{% url 'wh_job_list_ajax' %}",
                type: "GET"
            },
            columns: [
                { data: 'job_no' },
                { data: 'invoice' },
                { data: 'customer' },
                { data: 'edit', orderable: false, searchable: false },
                { data: 'delete', orderable: false, searchable: false }
            ]
        });
    });
</script>
{% endblock content %}
