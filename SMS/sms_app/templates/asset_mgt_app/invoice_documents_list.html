{% extends "asset_mgt_app/base_modern.html" %}

{% block content %}
<div class="container-fluid py-4">
    <!-- Page Header -->
    <div class="modern-header d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 text-white"><i class="fas fa-file-invoice mr-2"></i> Invoice Documents</h2>
        <div style="position: relative; z-index: 10;">
            <a href="{% url 'home_page' %}" class="btn-modern btn-cancel py-2 px-4" style="font-size: 0.9rem; text-decoration: none; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white !important;">
                <i class="fas fa-arrow-left"></i> BACK
            </a>
        </div>
    </div>

    <!-- Search Section -->
    <div class="modern-card mb-4 p-4">
        <form method="get" action="{% url 'invoice_documents_list' %}">
            <div class="row align-items-end">
                <div class="col-12 col-md-4 mb-3 mb-md-0">
                    <label class="form-label-modern">Vehicle Number</label>
                    <input type="text" class="form-control form-control-modern" name="veh_no"
                        placeholder="Vehicle Number" value="{{ veh_no }}">
                </div>
                <div class="col-12 col-md-3 mb-3 mb-md-0">
                    <label class="form-label-modern">Date From</label>
                    <input type="date" class="form-control form-control-modern" name="date_from"
                        value="{{ date_from }}">
                </div>
                <div class="col-12 col-md-3 mb-3 mb-md-0">
                    <label class="form-label-modern">Date To</label>
                    <input type="date" class="form-control form-control-modern" name="date_to"
                        value="{{ date_to }}">
                </div>
                <div class="col-12 col-md-2 d-flex" style="gap: 10px;">
                    <button class="btn-modern btn-submit py-1 px-3 w-100" type="submit" style="height: 52px; font-size: 0.95rem;">
                        <i class="fa fa-search mr-1"></i> SEARCH
                    </button>
                    <a href="{% url 'invoice_documents_list' %}" class="btn-modern btn-cancel py-1 px-3 w-100 text-center d-flex align-items-center justify-content-center" style="height: 52px; font-size: 0.95rem; text-decoration: none;">
                        <i class="fa fa-times-circle mr-1"></i> CLEAR
                    </a>
                </div>
            </div>
        </form>
    </div>

    <!-- Table Container -->
    <div class="table-container-modern">
        <div class="form-section-title">
            <i class="fas fa-list-ul"></i> Invoice Documents Records
        </div>
        <div class="table-responsive">
            <table id="invoice_documents_table" class="table modern-table text-center">
                <thead>
                    <tr style="white-space: nowrap;">
                        <th>S.No</th>
                        <th>Enquiry Number</th>
                        <th>Consignment Number</th>
                        <th>Trip Number</th>
                        <th>Customer Name</th>
                        <th>Vehicle Number</th>
                        <th>From Location</th>
                        <th>To Location</th>
                        <th>Trip Date</th>
                        <th>Invoice Status</th>
                        <th>Combined PDF</th>
                        <th>Edit</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    $('#invoice_documents_table').DataTable({
        serverSide: true,
        processing: true,
        ajax: {
            url: "{% url 'invoice_documents_list_ajax' %}",
            type: "GET",
            data: function(d) {
                d.veh_no = $("input[name='veh_no']").val();
                d.date_from = $("input[name='date_from']").val();
                d.date_to = $("input[name='date_to']").val();
            }
        },
        order: [[3, 'desc']],
        scrollX: true,
        scrollCollapse: true,
        pageLength: 10,
        lengthMenu: [
            [10, 25, 50, 100],
            [10, 25, 50, 100]
        ],
        dom: 'lBfrtip',
        buttons: ['copy', 'csv', 'excel', 'print'],
        columnDefs: [
            { orderable: false, targets: [0, 9, 10, 11] } // S.No, Status, PDF, Edit
        ]
    });
});
</script>
{% endblock content %}
