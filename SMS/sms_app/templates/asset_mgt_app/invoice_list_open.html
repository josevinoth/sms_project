{% extends "asset_mgt_app/base_modern.html" %}
{% block content %}
<div class="container-fluid py-4 bvm-modern-layout">

    <!-- Header Section -->
    <div class="modern-list-header mb-4" style="display: block !important; overflow: hidden;">
        <div class="row align-items-center">
            <div class="col-12 col-md-8 text-center text-md-left mb-3 mb-md-0">
                <h3 class="mb-0 text-white" style="font-size:1.4rem; font-weight:700; letter-spacing:1px; text-transform:uppercase;">
                    <i class="fas fa-file-invoice-dollar mr-2"></i> {{invoice_type}}
                </h3>
            </div>
            <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-end">
                <a href="{% url 'home_page' %}" class="btn btn-cancel" style="border-radius:10px; display:inline-flex; align-items:center; padding:0.5rem 1.2rem; font-weight:600; text-transform:uppercase;">
                    <i class="fas fa-arrow-left mr-1"></i> Back
                </a>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="modern-card p-4" style="background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <div class="table-responsive">
            <table id="invoice_list_open" class="table table-hover modern-table w-100">
                <thead class="modern-thead">
                <tr>
                    <th>WH Job Number</th>
                    <th>Voucher Number</th>
                    <th>Shipper invoice Number</th>
                    <th>Customer Name</th>
                    <th>Customer Type</th>
                    <th>Checkin Date</th>
                    <th>Checkout Date</th>
                    <th>Revenue</th>
                </tr>
                </thead>
                <tbody>
                <!-- DataTables AJAX will populate this -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#invoice_list_open').DataTable({
        serverSide: true,
        processing: true,
        ajax: {
            url: window.location.href,
            type: 'GET'
        },
        columns: [
            { data: 'wh_job_no' },
            { data: 'wh_voucher_num' },
            { data: 'wh_goods_invoice' },
            { data: 'wh_customer_name', className: 'font-weight-bold' },
            { data: 'wh_customer_type' },
            { data: 'wh_checkin_time' },
            { data: 'wh_checkout_time' },
            { data: 'wh_total_invoice_cost', render: function(data) {
                return '<span class="badge" style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 0.4rem 0.8rem; font-size: 0.9rem; border-radius: 6px;">' + data + '</span>';
            } }
        ],
        responsive: true,
        scrollX: true,
        autoWidth: false,
        dom: '<"row align-items-center mb-3"<"col-sm-12 col-md-6"B><"col-sm-12 col-md-6 text-right"f>>' +
             '<"row"<"col-sm-12"tr>>' +
             '<"row mt-3"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
        buttons: [
            { extend: 'copy', className: 'btn btn-sm btn-outline-secondary' },
            { extend: 'csv', className: 'btn btn-sm btn-outline-secondary' },
            { extend: 'excel', className: 'btn btn-sm btn-outline-secondary' },
            { extend: 'print', className: 'btn btn-sm btn-outline-secondary' }
        ],
        drawCallback: function () {
            $('.dataTables_paginate > .pagination').addClass('pagination-modern');
        }
    });
});
</script>
{% endblock content %}
